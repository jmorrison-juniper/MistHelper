# ==============================================================================
# Naming and port policy (issue #2059)
# ==============================================================================
# Every service, container, network, and volume below carries the `misthelper-`
# prefix. Every published port sits between 1000 and 10000 and is not the vendor
# default.
#
# Why the prefix:
#   This file used to name two containers `arangodb` and `redis-stack`. Those
#   names belong to no project in particular, so a second project on the same
#   workstation takes them first and MistHelper then cannot start. That happened:
#   a container named `truck-arangodb` from another project held port 8529, and
#   the upgrade portal read that foreign database as its own store. The portal
#   reached a real server, received 401, and reported its own store unreachable.
#
# Why the ports moved:
#   A vendor default port is the port every other project also publishes. Moving
#   off the default removes the collision, and it also stops a stray client that
#   someone pointed at a default database from writing into this one.
#
#   | Service    | Vendor default | Published here |
#   | ---------- | -------------- | -------------- |
#   | ArangoDB   | 8529           | 9529           |
#   | Redis      | 6379           | 9379           |
#   | Insight UI | 8001           | 9526           |
#
#   Ports 2200, 8055, and 8056 do not move. None is a vendor default, each one
#   already sits in the required range, and each one is named in the README, in
#   the SSH guide, and in the browser tests.
#
# Why the network pins a subnet:
#   A bridge with no subnet takes the next free range from the runtime pool. Two
#   projects that both accept a pool address can receive the same range, and the
#   routes then collide on the host. A named subnet keeps this project on one
#   range that no other compose file in this fleet claims.
#
# Why one project name:
#   An explicit `name:` groups every service under one Podman pod, the same
#   pattern the fiber-planner project uses. Without it, the project name comes
#   from the current folder, and a worktree checkout then starts its own
#   separate pod instead of joining the shared one.
#
# Why no Ollama service:
#   No file under `src/` imports Ollama. The only other Ollama references live
#   in `scripts/mist_ideas_*`, standalone idea-generation tools that connect to
#   an external Ollama fleet through `OLLAMA_SERVERS` and never touch this
#   compose file. Issue #2167 records the removal.
# ==============================================================================

name: ${COMPOSE_PROJECT_NAME:-misthelper}

services:
  misthelper:
    # The published image is the one that CI builds and tests, so name it here.
    #
    # Warning: naming the image does not stop a rebuild. `podman-compose up -d`
    # with no service argument builds from the section below, overwrites this
    # tag with the local build, and prints no line that names the build. If the
    # checkout is behind `main`, that command downgrades the running container
    # and clears the labels that name the commit. Issue #2272 holds the
    # measurement: one run replaced the image of commit `6eb253f7` with a build
    # of commit `6095392c`, 18 commits behind, and the running code lost a
    # firmware repair.
    #
    # Pull first, then name the service. That pair never builds:
    #   podman pull ghcr.io/jmorrison-juniper/misthelper:latest
    #   podman rm -f misthelper-app
    #   .\scripts\compose.ps1 up -d --no-deps misthelper
    #
    # Read the commit that a running container holds with this command. An empty
    # answer names a local build, because only the CI build writes the label.
    #   podman inspect misthelper-app --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
    image: ghcr.io/jmorrison-juniper/misthelper:latest
    container_name: misthelper-app
    ports:
      # SSH access for interactive sessions
      - "2200:2200"
      # Web portal for data browsing and operations
      - "8055:8055"
      # Upgrade capture portal for pre-check and post-check work
      - "8056:8056"
      # SNMP service on an unprivileged container port
      - "1161:1161/udp"
    volumes:
      # Mount local data directory to persist SQLite database and logs
      # The container writes to /app/data, this maps it to ./data on host
      - ./data:/app/data:rw
    env_file:
      - .env
    environment:
      # Container-specific environment variables (override .env if needed)
      - OUTPUT_FORMAT=polyglot
      - DATABASE_PATH=/app/data/mist_data.db
      - PYTHONUNBUFFERED=1
      # Web portal port (must match exposed port)
      - WEB_PORT=8055
      # Upgrade capture portal port (must match exposed port)
      - CAPTURE_PORT=8056
      # Metrics gateway HTTP port
      - METRICS_PORT=8057
      # SNMP service port and community. Set SNMP_COMMUNITY in .env for production.
      - SNMP_PORT=1161
      - SNMP_COMMUNITY=${SNMP_COMMUNITY:-misthelper}
      - SNMP_BASE_OID=${SNMP_BASE_OID:-.1.3.6.1.4.1.8072.9999.9999}
      - METRICS_SNMP_BASE_OID=${METRICS_SNMP_BASE_OID:-.1.3.6.1.4.1.8072.9999.9999}
      # The resolver addresses the container tries when it cannot resolve
      # api.mist.com with the resolver that Podman gave it.
      #
      # Why: Podman gives the container one nameserver, its own DNS proxy on the
      # bridge gateway. That proxy answers a container name such as
      # `misthelper-arangodb`, and it forwards every other name to an upstream
      # resolver. When the network holds no upstream resolver, the proxy
      # forwards nothing, and every Mist API call fails with
      # "Temporary failure in name resolution".
      #
      # The start script tests each address below and adds the first one that
      # answers. It runs only after the container already failed to resolve the
      # name, and it appends, so the Podman proxy stays first and every
      # container name still resolves.
      #
      # Set this in .env to your own resolvers when your network blocks a public
      # resolver. Set it to an empty value to turn the repair off.
      - DNS_FALLBACK_SERVERS=${DNS_FALLBACK_SERVERS:-1.1.1.1,8.8.8.8}
      # Reuse the existing lowercase organization setting from .env.
      - METRICS_ORG_ID=${org_id}
      # Database connection. The service names below resolve on the project
      # network, and the ports match the non-default ports each service binds.
      - ARANGO_HOST=http://misthelper-arangodb:9529
      - REDIS_HOST=misthelper-redis
      - REDIS_PORT=9379
      # A container cannot start a sibling container, so the portal reports a
      # stopped dependency here and never tries to repair it.
      - CAPTURE_AUTOSTART=0
      # SSL settings for UV downloads (if needed)
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    depends_on:
      misthelper-arangodb:
        condition: service_healthy
      misthelper-redis:
        condition: service_healthy
    networks:
      - misthelper-network
    restart: unless-stopped
    # Health probe for the web portal readiness endpoint (issue #1863).
    # The two database services below already carry a probe. This service is
    # the one that writes every output file, so it needs the probe most.
    # The image installs no curl, so the probe runs the Python interpreter.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('WEB_PORT','8055')+'/ready',timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Interactive mode for CLI usage
    stdin_open: true
    tty: true

    # Common use cases - uncomment as needed:
    # Default: Site list export
    # command: ["python", "MistHelper.py", "--menu", "11", "--output-format", "sqlite"]

    # Device inventory
    # command: ["python", "MistHelper.py", "--menu", "12", "--output-format", "sqlite"]

    # Interactive mode (shows menu)
    # command: ["python", "MistHelper.py"]

    # Systematic testing
    # command: ["python", "MistHelper.py", "--test"]

  misthelper-arangodb:
    image: docker.io/arangodb/arangodb:3.12
    container_name: misthelper-arangodb
    # The server binds 9529 rather than the vendor default 8529, so the port is
    # the project port on the network and on the host alike. A stray client that
    # someone pointed at a default ArangoDB therefore cannot reach this data.
    command: ["arangod", "--server.endpoint", "tcp://0.0.0.0:9529"]
    ports:
      - "9529:9529"
    volumes:
      - misthelper-arangodb-data:/var/lib/arangodb3
    environment:
      # CRITICAL: ArangoDB only reads ARANGO_ROOT_PASSWORD on FIRST boot
      # (when /var/lib/arangodb3 is empty). Changing this value after the
      # volume is initialized has NO effect. To reset the password:
      #   podman stop misthelper-arangodb && podman rm misthelper-arangodb
      #   podman volume rm misthelper-arangodb-data
      #   podman compose up -d misthelper-arangodb
      - ARANGO_ROOT_PASSWORD=${ARANGO_ROOT_PASSWORD:-misthelper}
    networks:
      - misthelper-network
    restart: unless-stopped
    healthcheck:
      # The endpoint is named here as well. `arangosh` defaults to port 8529,
      # so without this flag the probe would test a port the server never binds
      # and the service would never report healthy.
      test:
        - "CMD"
        - "arangosh"
        - "--server.endpoint"
        - "tcp://127.0.0.1:9529"
        - "--server.password"
        - "${ARANGO_ROOT_PASSWORD:-misthelper}"
        - "--javascript.execute-string"
        - "print(1)"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  misthelper-redis:
    image: docker.io/redis/redis-stack:latest
    container_name: misthelper-redis
    ports:
      - "9379:9379"
      # RedisInsight web UI for browsing data. The bundled UI binds 8001 inside
      # the image, so the host side moves and the container side stays.
      - "9526:8001"
    volumes:
      - misthelper-redis-data:/data
    environment:
      # The server binds 9379 rather than the vendor default 6379, for the same
      # reason the database above moves off 8529.
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD:-misthelper} --port 9379
    networks:
      - misthelper-network
    restart: unless-stopped
    healthcheck:
      # `redis-cli` defaults to port 6379, so the probe names the port too.
      test: ["CMD", "redis-cli", "-p", "9379", "-a", "${REDIS_PASSWORD:-misthelper}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Observium, an SNMP monitoring system. It reads the metrics gateway.
  #
  # This service carries a profile, so `compose up` does not start it. Start it
  # only when you want the monitoring system:
  #
  #     .\scripts\compose.ps1 --profile monitoring up -d
  #
  # Why a profile: the monitoring system is optional. It carries its own
  # database and its own web server, and an operator who reads the Prometheus
  # endpoint instead needs none of it.
  #
  # The image is community maintained. It is not an Observium release.
  # ---------------------------------------------------------------------------
  misthelper-observium:
    image: docker.io/uberchuckie/observium:latest
    container_name: misthelper-observium
    profiles:
      - monitoring
    # The host name must be `observium`, because the bundled Apache
    # configuration and the bundled database both name it.
    hostname: observium
    ports:
      # The Observium web interface. Sign in with observium / observium, then
      # change that password.
      - "8668:8668"
      # Syslog. The container side keeps 514, and the host side moves, because a
      # rootless container cannot bind a port below 1024.
      - "1514:514/udp"
    volumes:
      # The image declares these four paths. `/config` holds the database and
      # the Observium configuration file, so it is the one that must persist.
      - misthelper-observium-config:/config
      - misthelper-observium-certificates:/opt/observium/certificates
      - misthelper-observium-logs:/opt/observium/logs
      - misthelper-observium-rrd:/opt/observium/rrd
      # The MistHelper MIB. Observium loads every file of this folder, so the
      # mount installs the MIB and no operator copies a file.
      #
      # Warning: this mount is read-write, not `:ro`. firstrun.sh runs
      # `chown nobody:users -R /opt/observium` on every container start to
      # match Observium's own file ownership scheme. A read-only bind mount
      # here makes that one file fail with "Read-only file system" on every
      # boot (harmless to content, since chown changes ownership only, but it
      # is noisy and worth avoiding). The container never rewrites the file's
      # content, so the checked-in copy stays the source of truth in practice.
      - ./documentation/mibs/MISTHELPER-MIB.mib:/opt/observium/mibs/MISTHELPER-MIB.mib
      # Fixes the Net-SNMP MIB search path on every start, so `snmpwalk -m
      # MISTHELPER-MIB` and `snmptranslate` can resolve SNMPv2-SMI/SNMPv2-TC
      # from the IETF set Observium already bundles. See the script for why.
      - ./container/observium/10-fix-mib-search-path.sh:/etc/my_init.d/10-fix-mib-search-path.sh:ro
      # Registers the Mist Cloud health metrics as native Observium "static
      # sensors" (the Community Edition path for a custom vendor MIB), so the
      # values reach Observium's own sensor poller and RRD graphs instead of
      # only being visible through manual snmpwalk. See the script for why.
      - ./container/observium/20-add-mist-static-sensors.sh:/etc/my_init.d/20-add-mist-static-sensors.sh:ro
      # Walks the site, device, and SLE tables of MISTHELPER-MIB at discovery
      # time and registers one sensor per populated cell. Row counts change
      # over time (a NOC adds a site, Mist retires a device), so these three
      # tables cannot use the fixed config.php mechanism the file above uses
      # for the org-level scalars. See the script for the full reason and for
      # why it is safe for this file to run against every Linux/Unix device.
      #
      # Read-write, not `:ro`, for the same reason as the MIB mount above:
      # this path sits under /opt/observium, and firstrun.sh's recursive
      # chown fails loudly (though harmlessly) on a read-only file there.
      - ./container/observium/discovery-sensors-unix.inc.php:/opt/observium/includes/discovery/sensors/unix.inc.php
    networks:
      - misthelper-network
    restart: unless-stopped

networks:
  misthelper-network:
    name: misthelper-network
    driver: bridge
    ipam:
      config:
        # A range that no other compose file in this fleet claims. A bridge with
        # no subnet takes the next free range from the runtime pool, and two
        # projects can then receive the same range.
        - subnet: 172.31.240.0/24

volumes:
  misthelper-data:
    name: misthelper-data
    driver: local
  misthelper-arangodb-data:
    name: misthelper-arangodb-data
    driver: local
  misthelper-redis-data:
    name: misthelper-redis-data
    driver: local
  misthelper-observium-config:
    name: misthelper-observium-config
    driver: local
  misthelper-observium-certificates:
    name: misthelper-observium-certificates
    driver: local
  misthelper-observium-logs:
    name: misthelper-observium-logs
    driver: local
  misthelper-observium-rrd:
    name: misthelper-observium-rrd
    driver: local

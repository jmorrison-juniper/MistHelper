version: '3.8'

services:
  misthelper:
    build: 
      context: .
      dockerfile: Containerfile  # Use Containerfile for Podman, Dockerfile for Docker
    container_name: misthelper-app
    ports:
      # SSH access for interactive sessions
      - "2200:2200"
      # Web portal for data browsing and operations
      - "8055:8055"
    volumes:
      # Mount local data directory to persist SQLite database and logs
      # The container writes to /app/data, this maps it to ./data on host
      - ./data:/app/data:rw
    env_file:
      - .env
    environment:
      # Container-specific environment variables (override .env if needed)
      - OUTPUT_FORMAT=sqlite
      - DATABASE_PATH=/app/data/mist_data.db
      - PYTHONUNBUFFERED=1
      # Web portal port (must match exposed port)
      - WEB_PORT=8055
      # SSL settings for UV downloads (if needed)
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
    networks:
      - misthelper-network
    restart: unless-stopped
    # Interactive mode for CLI usage
    stdin_open: true
    tty: true
    
    # Common use cases - uncomment as needed:
    # Default: Site list export
    # command: ["python", "MistHelper.py", "--menu", "11", "--output-format", "sqlite"]
    
    # Device inventory
    # command: ["python", "MistHelper.py", "--menu", "12", "--output-format", "sqlite"]
    
    # Interactive mode (shows menu)
    # command: ["python", "MistHelper.py"]
    
    # Systematic testing
    # command: ["python", "MistHelper.py", "--test"]

  # Optional: Use Docker format for Docker users
  # misthelper-docker:
  #   build: 
  #     context: .
  #     dockerfile: Dockerfile  # Docker-compatible version with HEALTHCHECK
  #   # ... same config as above

  ollama:
    image: docker.io/ollama/ollama
    container_name: ollama-misthelper
    ports:
      - "11434:11434"
    volumes:
      # Named volume keeps models across container restarts/upgrades.
      # Without this, every `podman rm` wipes the downloaded models.
      - ollama-models:/root/.ollama
    environment:
      # MoE CPU offload: expert FFN layers run from system RAM,
      # attention/embedding layers stay on GPU.  Drops mixtral:8x7b
      # VRAM requirement from ~26 GB to ~10 GB.
      - OLLAMA_SCHED_SPREAD=1
      # KV cache quantization: q8_0 halves VRAM vs fp16 default
      # with negligible quality loss. q4_0 saves more but causes
      # measurable perplexity drift on longer contexts.
      - OLLAMA_KV_CACHE_TYPE=q8_0
    dns:
      # Explicit DNS avoids Podman virtual network DNS failures
      # when pulling large models from Cloudflare R2 (ollama.com).
      - 8.8.8.8
      - 1.1.1.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - misthelper-network
    restart: unless-stopped

networks:
  misthelper-network:
    driver: bridge

volumes:
  misthelper-data:
    driver: local
  # Persistent model storage for the local Ollama instance.
  # Models survive container restarts, upgrades, and `podman rm`.
  ollama-models:
    driver: local

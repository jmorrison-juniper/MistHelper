# ==============================================================================
# Build section for the misthelper service (issue #2272)
# ==============================================================================
# This file holds the build section that compose.yml used to carry. A plain
# `up` reads compose.yml only, so it can never build the image and never
# overwrites the published tag with a local build.
#
# The helper script merges this file only when the operator asks for a build:
#   .\scripts\compose.ps1 build
#
# The helper checks `origin/main` before a build. It stops stale checkouts
# unless the operator passes `--allow-stale`. An allowed stale build uses
# `misthelper:local`, so it cannot replace the published image name.
# Read the revision after the run:
#   .\scripts\compose.ps1 check-revision
# ==============================================================================

services:
  misthelper:
    image: ${MISTHELPER_BUILD_IMAGE:-ghcr.io/jmorrison-juniper/misthelper:latest}  # Keep normal builds on the published name.
    build:
      context: .
      dockerfile: Containerfile  # Use Containerfile for Podman, Dockerfile for Docker
      labels:
        org.opencontainers.image.revision: "${MISTHELPER_BUILD_REVISION:?Run scripts/compose.ps1 build to set the source revision}"

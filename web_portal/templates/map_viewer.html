{% extends "base.html" %}
{% block title %}Map Viewer - {{ config.PORTAL.title }}{% endblock %}

{% block content %}
<div class="row mb-3">
    <div class="col">
        <h4>Map Viewer</h4>
        <p class="text-muted">View site floor plans and device placements.</p>
    </div>
</div>

<div class="row">
    <!-- Left: Site / Map Selector -->
    <div class="col-md-3">
        <div class="portal-card mb-3 p-3">
            <label class="form-label" for="siteSelect">Site</label>
            <select class="form-select" id="siteSelect" onchange="onSiteChange()" data-testid="site-select">
                <option value="">-- Select a site --</option>
            </select>

            <label class="form-label mt-3" for="mapSelect">Floor Plan</label>
            <select class="form-select" id="mapSelect" onchange="onMapChange()" disabled data-testid="map-select">
                <option value="">-- Select a map --</option>
            </select>
        </div>

        <!-- Device List -->
        <div class="portal-card p-3 d-none" id="devicePanel" data-testid="device-panel">
            <h6>Devices (<span id="deviceCount">0</span>)</h6>
            <ul class="list-group list-group-flush" id="deviceList"></ul>
        </div>
    </div>

    <!-- Right: Map Render Area -->
    <div class="col-md-9">
        <div class="portal-card p-2" id="mapContainer" data-testid="map-container">
            <div class="text-muted small px-2 pt-1 d-none" id="mapImageNote" role="status" data-testid="map-image-note"></div>
            <div id="plotArea" class="plot-area">
                <div class="text-center text-muted py-5" id="mapPlaceholder">
                    Select a site and floor plan to view the map.
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="{{ url_for('static', filename='vendor/plotly/plotly.min.js') }}"></script>
<script>
/* global Plotly */

var currentDevices = [];
// Count each map view. A late answer of an older view must not draw over a newer map.
var mapViewNumber = 0;
// The note for a map that holds no floor plan image, such as a Google map.
var NO_IMAGE_NOTE = 'This floor plan has no image. The map shows the device positions only.';
// The note for a floor plan image that did not load, such as an expired link.
var IMAGE_FAILED_NOTE = 'The portal could not load the floor plan image. The map shows the device positions only.';

function showImageNote(text) {
    var note = document.getElementById('mapImageNote');
    // Write the note with textContent, so the text can never run as markup.
    note.textContent = text;
    note.classList.remove('d-none');
}

function hideImageNote() {
    var note = document.getElementById('mapImageNote');
    note.textContent = '';
    note.classList.add('d-none');
}

function loadSites() {
    fetch('/api/maps/sites')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var sel = document.getElementById('siteSelect');
            (data.sites || []).forEach(function(site) {
                var opt = document.createElement('option');
                opt.value = site.id;
                opt.textContent = site.name;
                sel.appendChild(opt);
            });
        });
}

function onSiteChange() {
    var siteId = document.getElementById('siteSelect').value;
    var mapSel = document.getElementById('mapSelect');
    mapSel.innerHTML = '<option value="">-- Select a map --</option>';
    mapSel.disabled = true;
    clearMap();
    if (!siteId) { return; }

    fetch('/api/maps/site/' + siteId + '/maps')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            (data.maps || []).forEach(function(m) {
                var opt = document.createElement('option');
                opt.value = m.id;
                opt.textContent = m.name + (m.has_image ? '' : ' (no image)');
                opt.dataset.width = m.width;
                opt.dataset.height = m.height;
                mapSel.appendChild(opt);
            });
            mapSel.disabled = false;
        });
}

function onMapChange() {
    var siteId = document.getElementById('siteSelect').value;
    var mapId = document.getElementById('mapSelect').value;
    clearMap();
    if (!siteId || !mapId) { return; }
    // Keep the number of this view. A newer choice changes the number.
    var view = mapViewNumber;

    fetch('/api/maps/site/' + siteId + '/map/' + mapId + '/data')
        .then(function(r) { return r.json(); })
        .then(function(data) {
            // Ignore the answer if the operator chose another map first.
            if (view !== mapViewNumber) { return; }
            if (data.error) {
                document.getElementById('mapPlaceholder').textContent = data.error;
                return;
            }
            renderMap(data, view);
        })
        .catch(function() {
            if (view !== mapViewNumber) { return; }
            document.getElementById('mapPlaceholder').textContent = 'Failed to load map data.';
        });
}

function renderMap(data, view) {
    document.getElementById('mapPlaceholder').classList.add('d-none');
    currentDevices = data.devices || [];

    var xCoords = [];
    var yCoords = [];
    var labels = [];
    var colors = [];

    currentDevices.forEach(function(d) {
        xCoords.push(d.x);
        yCoords.push(d.y);
        labels.push(d.name || d.mac || 'Unknown');
        colors.push(deviceColor(d.type));
    });

    var trace = {
        x: xCoords,
        y: yCoords,
        mode: 'markers+text',
        type: 'scatter',
        text: labels,
        textposition: 'top center',
        textfont: { size: 10, color: '#ffffff' },
        marker: { size: 12, color: colors, symbol: 'circle' },
        hovertemplate: '%{text}<br>x=%{x}, y=%{y}<extra></extra>'
    };

    var imgUrl = data.image_url || '';
    var mapW = data.width || 100;
    var mapH = data.height || 100;

    var images = [];
    if (imgUrl) {
        images.push({
            source: imgUrl,
            xref: 'x',
            yref: 'y',
            x: 0,
            y: 0,
            sizex: mapW,
            sizey: mapH,
            sizing: 'stretch',
            layer: 'below',
            opacity: 0.8
        });
    }

    var layout = {
        title: data.name || 'Floor Plan',
        xaxis: { range: [0, mapW], showgrid: false, zeroline: false, visible: false },
        yaxis: { range: [mapH, 0], showgrid: false, zeroline: false, visible: false, scaleanchor: 'x' },
        images: images,
        paper_bgcolor: 'rgba(0,0,0,0)',
        plot_bgcolor: 'rgba(0,0,0,0)',
        margin: { l: 20, r: 20, t: 40, b: 20 },
        showlegend: false
    };

    Plotly.newPlot('plotArea', [trace], layout, {
        responsive: true,
        scrollZoom: true
    }).then(function(plot) {
        // The promise ends after the image load. Plotly removes an image that
        // fails to load and shows no sign, so read the plot to find the failure.
        if (view !== mapViewNumber) { return; }
        if (imgUrl && !plot.querySelector('.imagelayer image')) {
            showImageNote(IMAGE_FAILED_NOTE);
        }
    });

    if (!imgUrl) {
        // Explain the empty field, because this map has no floor plan image.
        showImageNote(NO_IMAGE_NOTE);
    }
    renderDeviceList(currentDevices);
}

function deviceColor(type) {
    var map = { ap: '#0dcaf0', switch: '#ffc107', gateway: '#198754' };
    // Read an own property only. A device type such as "constructor" would
    // otherwise return a built-in function instead of a color string.
    if (Object.prototype.hasOwnProperty.call(map, type)) {
        return map[type];
    }
    // Fall back to the neutral gray for an unknown device type.
    return '#6c757d';
}

function renderDeviceList(devices) {
    var panel = document.getElementById('devicePanel');
    var list = document.getElementById('deviceList');
    document.getElementById('deviceCount').textContent = devices.length;
    list.innerHTML = '';

    if (devices.length === 0) {
        panel.classList.add('d-none');
        return;
    }

    panel.classList.remove('d-none');
    devices.forEach(function(d) {
        var li = document.createElement('li');
        li.className = 'list-group-item py-1';
        // Build the colored dot as a node. A style property is a safe sink,
        // and deviceColor returns a value from a fixed set.
        var dot = document.createElement('span');
        dot.style.color = deviceColor(d.type);
        // Use the escape form of the black circle so that the file stays ASCII.
        dot.textContent = '\u25CF';
        // Render the device label with textContent. The browser escapes the
        // value, so a crafted device name cannot run as script. See #1939.
        var label = document.createElement('span');
        label.textContent = ' ' + (d.name || d.mac || 'Unknown') + ' ';
        // Render the device type through the same safe sink, because the type
        // arrives in the same untrusted API record as the name.
        var type = document.createElement('small');
        type.className = 'text-muted';
        type.textContent = '(' + (d.type || 'unknown') + ')';
        // Append the three nodes in reading order to rebuild the old layout.
        li.appendChild(dot);
        li.appendChild(label);
        li.appendChild(type);
        list.appendChild(li);
    });
}

function clearMap() {
    // Start a new view. A late answer of the old view now draws nothing.
    mapViewNumber += 1;
    hideImageNote();
    var area = document.getElementById('plotArea');
    Plotly.purge(area);
    area.innerHTML = '';
    var ph = document.createElement('div');
    ph.className = 'text-center text-muted py-5';
    ph.id = 'mapPlaceholder';
    ph.textContent = 'Select a site and floor plan to view the map.';
    area.appendChild(ph);
    document.getElementById('devicePanel').classList.add('d-none');
}

document.addEventListener('DOMContentLoaded', function() {
    loadSites();
});
</script>
{% endblock %}

[project]
name = "misthelper"
version = "2.1.0"
description = "Network operations tool for Juniper Mist cloud infrastructure management and monitoring"
readme = "README.md"
license = {text = "CC-BY-NC-SA-4.0"}
authors = [
    {name = "Joseph Morrison", email = "jmorrison@juniper.net"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology", 
    "Intended Audience :: Telecommunications Industry",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.13"
dependencies = [
    # Core API and networking
    "mistapi>=0.59.0",
    "requests>=2.28.0",
    "websocket-client>=1.4.0",
    
    # CLI and user interface
    "prettytable>=3.5.0",
    "tqdm>=4.64.0",
    "sshkeyboard>=2.3.0",
    
    # Data processing
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    
    # Terminal emulation for SSH operations
    "pyte>=0.8.0",
    
    # Address parsing and fuzzy matching
    "usaddress-scourgify>=0.6.0",
    "rapidfuzz>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "hypothesis>=6.0.0",
    "playwright>=1.40.0",
    "pre-commit>=3.0.0",
]
container = [
    "uvicorn>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/jmorrison-juniper/MistHelper"
Repository = "https://github.com/jmorrison-juniper/MistHelper.git"
Documentation = "https://github.com/jmorrison-juniper/MistHelper#readme"
Issues = "https://github.com/jmorrison-juniper/MistHelper/issues"

[project.scripts]
misthelper = "MistHelper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T20"]
ignore = ["PLR0915", "C901", "PLR0912", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20", "B011"]

[tool.mypy]
python_version = "3.13"
strict = true
allow_untyped_defs = true
allow_untyped_calls = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.bandit]
targets = ["MistHelper.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "setup.py",
    "*/site-packages/*"
]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

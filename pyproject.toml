[project]
name = "misthelper"
version = "2.1.0"
description = "Network operations tool for Juniper Mist cloud infrastructure management and monitoring"
readme = "README.md"
license = {text = "CC-BY-NC-SA-4.0"}
authors = [
    {name = "Joseph Morrison", email = "jmorrison@juniper.net"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology", 
    "Intended Audience :: Telecommunications Industry",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.13"
dependencies = [
    # Core API and networking
    "mistapi>=0.61.4",
    "requests>=2.28.0",
    "websocket-client>=1.8.0",
    
    # CLI and user interface
    "prettytable>=3.5.0",
    "tqdm>=4.64.0",
    "sshkeyboard>=2.3.0",
    
    # Data processing
    "numpy>=1.24.0",
    "python-dotenv>=1.2.2",
    
    # Terminal emulation for SSH operations
    "pyte>=0.8.0",
    
    # Address parsing and fuzzy matching
    "usaddress-scourgify>=0.6.0",
    "rapidfuzz>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "ruff>=0.8.0",
    "black==26.3.1",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",   # stubs for requests (Phase 1 fix)
    "types-paramiko>=3.0.0",    # stubs for paramiko (Phase 1 fix)
    "types-tqdm>=4.64.0",       # stubs for tqdm (Phase 1 fix)
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "pylint>=3.0.0",
    "radon>=6.0.0",
    "vulture>=2.10",
    "pydocstyle[toml]>=6.3.0",
    "interrogate>=1.7.0",
    "hypothesis>=6.151.12",
    "playwright>=1.40.0",
    "pre-commit>=3.0.0",
]
container = [
    "uvicorn>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/jmorrison-juniper/MistHelper"
Repository = "https://github.com/jmorrison-juniper/MistHelper.git"
Documentation = "https://github.com/jmorrison-juniper/MistHelper/wiki"
Issues = "https://github.com/jmorrison-juniper/MistHelper/issues"

[project.scripts]
misthelper = "MistHelper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["mist-ops-platform", "ops-portal", "web_portal", "scripts", "specs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Phase 1 ignores (2026-03-12) — tighten these incrementally:
#   E402: module-import-not-at-top (33) — intentional: version check runs before imports
#   RESOLVED: F402, B007, PLR0913, E501, PLR0915/C901/PLR0912 (166 noqa annotations)
# Phase 2 goal: re-enable T20 (print) after migrating prints to logging
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.13"
strict = true
# --- Phased strict compliance (started 2025-07-12) ---
# Full strict mode: all checks enforced with inline type: ignore annotations
#   RESOLVED: warn_return_any, disallow_any_generics, disallow_untyped_defs/calls/incomplete_defs
#   Remaining annotations: type: ignore[*] on legacy untyped code — reduce over time
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = false
exclude = ["mist-ops-platform", "ops-portal", "web_portal", "maps_manager", "scripts", "specs", "tests"]

[[tool.mypy.overrides]]
# Dash dynamically generates HTML/DCC component classes (Div, Span, P, Button, etc.)
# at runtime — mypy cannot resolve them statically, producing false attr-defined errors.
# follow_imports = skip prevents mypy from analyzing dash internals at all.
module = ["dash", "dash.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Skip type-checking for imported modules that are not part of the CI target (MistHelper.py).
# maps_manager: large module with its own type issues — Phase 2 target
# web_portal: Flask app with its own type issues — Phase 2 target
# Others: third-party or legacy code not under active development
module = ["maps_manager", "maps_manager.*", "mist-ops-platform.*", "ops-portal.*", "web_portal.*", "scripts.*", "specs.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Tests: relax strict mode — test functions rarely benefit from full type annotations.
# Phase 2 target: incrementally add annotations to test helpers.
module = [
    "tests",
    "tests.*",
    "tests.unit.*",
    "tests.e2e.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
check_untyped_defs = false
strict = false

[tool.bandit]
targets = ["MistHelper.py", "maps_manager.py", "wsgi.py", "web_portal", "src"]
exclude_dirs = ["tests", ".venv", "node_modules", "mist-ops-platform", "ops-portal", "scripts", "specs"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "setup.py",
    "*/site-packages/*"
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# --- Black (redundant with ruff format, included for explicit gate) ---
[tool.black]
line-length = 120
target-version = ["py313"]
extend-exclude = "mist-ops-platform|ops-portal|web_portal|scripts|specs"

# --- Pylint ---
[tool.pylint.main]
fail-under = 9.5

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
# Docstring enforcement handled by pydocstyle/interrogate
disable = ["C0114", "C0115", "C0116"]

[tool.pylint.basic]
good-names = ["i", "e", "f", "db", "ok"]

# --- pydocstyle ---
[tool.pydocstyle]
convention = "google"
match-dir = "(?!tests|\\.).*"

# --- Interrogate (docstring coverage) ---
[tool.interrogate]
fail-under = 90
exclude = ["tests", ".venv", "setup.py"]
verbose = 1
generate-badge = "."
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = false
ignore-private = false

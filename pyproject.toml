[project]
name = "misthelper"
version = "2.1.0"
description = "Network operations tool for Juniper Mist cloud infrastructure management and monitoring"
readme = "README.md"
license = {text = "CC-BY-NC-SA-4.0"}
authors = [
    {name = "Joseph Morrison", email = "jmorrison@juniper.net"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology", 
    "Intended Audience :: Telecommunications Industry",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.13"
dependencies = [
    # Core API and networking
    "mistapi>=0.63.1",
    "requests>=2.28.0",
    "websocket-client>=1.8.0",
    
    # CLI and user interface
    "prettytable>=3.5.0",
    "tqdm>=4.64.0",
    "sshkeyboard>=2.3.0",
    
    # Data processing
    "numpy",
    "matplotlib",
    "python-dotenv>=1.0.0",
    
    # SSH client
    "paramiko",

    # Terminal emulation for SSH operations
    "pyte>=0.8.0",
    
    # Address parsing and fuzzy matching
    "usaddress-scourgify>=0.6.0",
    "rapidfuzz>=3.8.0",

    # Polyglot database backends (ArangoDB + Redis TimeSeries)
    "python-arango>=8.3.2",
    "redis[hiredis]>=7.4.0",

    # Structured logging for database modules
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "coverage>=7.0.0",
    "ruff>=0.8.0",
    "black==26.5.1",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",   # stubs for requests (Phase 1 fix)
    "types-paramiko>=3.0.0",    # stubs for paramiko (Phase 1 fix)
    "types-tqdm>=4.64.0",       # stubs for tqdm (Phase 1 fix)
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
    "pylint>=3.0.0",
    "radon>=6.0.0",
    "vulture>=2.10",
    "pydocstyle[toml]>=6.3.0",
    "interrogate>=1.7.0",
    "hypothesis>=6.151.12",
    "libcst>=1.5",              # AST-based codemod for #429 logging f-string sweep
    "playwright>=1.40.0",
    "pre-commit>=3.0.0",
]
container = [
    "uvicorn>=0.20.0",
]
ste-linter = [
    # Optional spaCy backend for the STE writing linter. It improves the accuracy
    # of the part-of-speech, tense, and noun-cluster checks. The linter still runs
    # without it through the standard-library heuristic backend.
    # After install, download the model: python -m spacy download en_core_web_sm
    "spacy>=3.7.0,<4.0.0",
    # pdfplumber reads the licensed ASD-STE100 PDF by word position for the
    # dictionary extraction tool (tools/ste_linter/dictionary/extract.py). It is
    # needed only to build the local dictionary, not to run the linter.
    "pdfplumber>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/jmorrison-juniper/MistHelper"
Repository = "https://github.com/jmorrison-juniper/MistHelper.git"
Documentation = "https://github.com/jmorrison-juniper/MistHelper/wiki"
Issues = "https://github.com/jmorrison-juniper/MistHelper/issues"

[project.scripts]
misthelper = "MistHelper:main"
test-quality-analyzer = "tools.test_quality_analyzer.__main__:main"
ste-linter = "tools.ste_linter.__main__:main"

[tool.ste_linter]
# Default settings for the STE writing linter. See tools/ste_linter/README.md.
min_score = 80
dictionary = "data/ste_dictionary.json"
prefer_spacy = true
# Approved technical terms the dictionary rules must not flag. These are correct
# programming and networking words that are not in the general ASD-STE100
# vocabulary. The allowlist raises the signal so the linter flags real prose words,
# not normal software terms. Keep the list sorted and lower case.
allowlist = [
    "api", "async", "attribute", "backend", "boolean", "buffer", "build", "cache",
    "call", "callable", "checksum", "cli", "commit", "config", "csv", "daemon",
    "debug", "decorator", "dispatch", "dns", "endpoint", "enum", "env", "exception",
    "file", "firmware", "frontend", "getter", "gui", "hash", "http", "https", "id",
    "int", "iterable", "json", "kwarg", "lan", "lint", "list", "log", "mac",
    "metadata", "middleware", "mock", "module", "namespace", "org", "param",
    "parser", "payload", "pip", "proxy", "query", "regex", "repo", "retry", "return",
    "run", "schema", "session", "setter", "socket", "sql", "ssh", "stub", "tcp",
    "thread", "timeout", "timestamp", "token", "trace", "traceback", "tui", "tuple",
    "udp", "url", "uuid", "venv", "vpn", "wan", "wrapper",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"
# extend-exclude: per-entry justified under #886. Each entry is a subtree ruff
# currently silences; the goal is to shrink this list over time as sibling
# gates (#879 Black, #881 Bandit, #883/#884 mypy) also clean up their exclude
# lists on the same subtrees.
#   mist-ops-platform -- vendored subtree, 95 .py files with 183 ruff violations
#                        (mostly UP*). Non-trivial fix; also excluded from mypy
#                        (#884). Follow-up: dedicated vendor-sweep issue.
#   web_portal        -- Flask app, 16 .py files with ~23 ruff violations
#                        (UP045 etc). Also excluded from mypy (#884). Follow-up:
#                        Phase-2 web_portal typing/lint sweep.
#   scripts           -- dev tooling, 32 .py files with ~24 ruff violations.
#                        Also excluded from mypy (#884). Follow-up: scripts-lint
#                        sweep issue.
#   src/maps          -- matplotlib/plotly viewer subtree, 27 .py files with
#                        183 ruff violations (mostly E501). Also excluded from
#                        mypy (#884) and coverage (#878). Follow-up: Phase-2
#                        src/maps typing/lint sweep.
# Dropped in #886 (this commit):
#   ops-portal -- 0 .py files (JS/React frontend), never scanned; also dropped
#                 from mypy in #884.
#   specs      -- 2 .py files, ruff-clean after fixing 1 B007 and applying
#                 ruff --fix (UP015/I001/F541).
extend-exclude = ["mist-ops-platform", "web_portal", "scripts", "src/maps"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "G", "PLW1514"]
# Issue #1795: PLW1514 (unspecified-encoding) is a preview rule. `preview` turns
# preview rules on and `explicit-preview-rules` limits them to the codes named in
# `select`, so no other preview rule reaches this gate. An `open()` call in text
# mode without an explicit encoding uses the platform default. Windows returns
# cp1252 and Linux returns utf-8. MistHelper writes state files on a Windows
# workstation and reads them inside a Linux container, so a missing encoding
# corrupts every character above code point 127.
preview = true
explicit-preview-rules = true
# Phase 1 ignores (2026-03-12) -- tighten these incrementally:
#   RESOLVED (2026-07-19, #886 slice): E402 moved from repo-wide ignore to
#     scoped per-file-ignores; see the E402 block in [tool.ruff.lint.per-file-ignores]
#     below. Actual pattern breakdown at time of migration (160 sites):
#       (a) MistHelper.py -- 144 sites -- Cat E canonical re-exports after
#           the argparse/warnings preamble (1015 refactor).
#       (b) tests/unit/*.py -- 14 sites across 8 files -- sys.path/pytest
#           bootstrap before test imports.
#       (c) tools/test_quality_analyzer/__main__.py -- 2 sites -- CLI
#           bootstrap.
#   RESOLVED: F402, B007, PLR0913, E501, PLR0915/C901/PLR0912 (166 noqa annotations)
# Phase 2 goal: re-enable T20 (print) after migrating prints to logging
#   -- follow-up under #886: 5053 T20 violations across src/, MistHelper.py,
#      wsgi.py, and starlink_dashboard.py; too large for a single PR.
# Issue #429 (2026-06-23): enabled `G` rule family after sweeping all 695 G003/G004/G201 sites in MistHelper.py
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# Issue #433 Phase A swept G003/G004/G201 from src/, tools/, web_portal/,
# starlink_dashboard.py, wsgi.py, and maps_manager.py (#429 had previously
# cleaned up MistHelper.py). Only the codemod synthetic input fixture
# retains G violations on purpose -- they are the test material.
# Both #429 and #433 are CLOSED; the fixture is still exercised by
# tests/test_issue_429_codemod_idempotent.py (verified live under #885).
"tests/fixtures/issue_429_codemod_synthetic_input.py" = ["G"]
# plan_wave_builder.py embeds a literal multi-line prompt template that is
# rendered verbatim into subagent task payloads; reflowing the lines would
# change the prompt content sent to the model. Externalizing the prompt
# to a .txt fixture is possible but is a behavioral refactor tracked
# separately -- see #885 discussion.
"tools/plan_wave_builder.py" = ["E501"]
# refactor_analyzer/reporting.py emits literal markdown strings for the
# refactor_candidates.md report; reflowing the lines would break the rendered
# markdown structure of the generated report.
"tools/refactor_analyzer/reporting.py" = ["E501"]
# test_quality_analyzer subtree: internal style uses %-format for diagnostic
# messages and str-subclass Enums for JSON .value serialization (see
# detection/types.py docstring). Neither is a correctness issue.
"tools/test_quality_analyzer/**" = ["UP031", "UP042"]
"tests/tools/test_quality_analyzer/**" = ["UP031"]
# Bad fixtures deliberately embody the anti-patterns the analyzer detects;
# ruff must not "fix" the material under test.
"tools/test_quality_analyzer/fixtures/bad/**" = ["UP031", "UP042", "B017", "G", "F", "E"]
# E402 (module-level import not at top): scoped per-file after #886 removed
# the repo-wide ignore. Each file legitimately needs pre-import statements:
#   MistHelper.py -- warnings.filterwarnings() must run before the stdlib
#     import block, and the Cat E canonical re-exports at the bottom follow
#     mid-file class-block definitions from the 1015 refactor (144 sites).
#   tests/unit/*.py -- test-module bootstrapping (sys.path/os.environ
#     manipulation) before importing the module under test.
#   tools/test_quality_analyzer/__main__.py -- CLI entrypoint sys.path setup.
"MistHelper.py" = ["E402"]
"tests/unit/test_bulk_switch_upgrader.py" = ["E402"]
"tests/unit/test_csv_comparator.py" = ["E402"]
"tests/unit/test_device_utility_commands.py" = ["E402"]
"tests/unit/test_routing_utils.py" = ["E402"]
"tests/unit/test_site_auto_upgrade.py" = ["E402"]
"tests/unit/test_template_config.py" = ["E402"]
"tests/unit/test_wan2_variable.py" = ["E402"]
"tests/unit/test_zone_analyzer.py" = ["E402"]
"tools/test_quality_analyzer/__main__.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
strict = true
# --- Phased strict compliance (started 2025-07-12) ---
# Full strict mode: all checks enforced with inline type: ignore annotations
#   RESOLVED: warn_return_any, disallow_any_generics, disallow_untyped_defs/calls/incomplete_defs
#   Remaining annotations: type: ignore[*] on legacy untyped code — reduce over time
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = true
explicit_package_bases = true
# exclude: each entry justified per issue #884 AC.
#   mist-ops-platform     -- vendored subtree ships its own ./src/__init__.py, which
#                            would collide with the project's top-level src/ package if
#                            both were scanned (duplicate-module error). Hard requirement.
#   web_portal            -- Flask app; Phase-2 typing target (needs types-flask + per-view
#                            annotations). Also covered by follow_imports=silent (#883).
#   src/maps              -- matplotlib/plotly viewer subtree; Phase-2 typing target. Also
#                            covered by follow_imports=silent (#883) and coverage omit (#878).
#   tests                 -- test suite; strict mode not appropriate for pytest fixtures.
#                            The [[overrides]] block for tests below is now dead config —
#                            AC (#884) says "pick one"; we picked exclude. Track re-scan
#                            under a future Phase-2 tests-typing issue.
#   scripts               -- 584 mypy errors at strict; out of scope for #884. Dev tooling
#                            typing sweep will be tracked separately.
#   tools                 -- 61 mypy errors; dev tooling with codemod fixtures whose bad/
#                            files deliberately embody anti-patterns. Track under a future
#                            tools-typing sweep. Re-measured 2026-08-05 for #888.
#   MistHelper.py         -- REMOVED from this list on 2026-08-05 for issue #888. The file
#                            reported 118 strict errors when #884 wrote this note. It
#                            reports 0 today, because the decomposition waves moved the
#                            untyped code into src/. The CI mypy gate now scans it through
#                            MYPY_PATHS in .github/workflows/ci.yml. Proved by injecting a
#                            type error and confirming the gate caught it.
#   starlink_dashboard.py -- standalone dashboard app; 76 strict errors. Needs its own
#                            typing sweep — track separately.
# Dropped from prior list in #884: ops-portal (0 .py files), maps_manager (never existed
# as top-level module), specs (no runtime Python; one inline script annotation fixed).
exclude = [
    "mist-ops-platform",
    "web_portal",
    "src/maps",
    "tests",
    "scripts",
    "tools",
    "starlink_dashboard.py",
]

[[tool.mypy.overrides]]
# Dash dynamically generates HTML/DCC component classes (Div, Span, P, Button, etc.)
# at runtime — mypy cannot resolve them statically, producing false attr-defined errors.
# follow_imports = skip prevents mypy from analyzing dash internals at all.
module = ["dash", "dash.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Non-CI-target modules: MistHelper.py (monolith being refactored), src.maps.*
# (matplotlib/plotly viewer subtree — its own Phase-2 target), and web_portal.*
# (Flask app — needs types-flask + per-view annotations). Using `follow_imports = "silent"`
# means mypy still follows imports to resolve real types at call sites but suppresses
# error reporting from these files themselves. This is deliberately narrower than
# `follow_imports = "skip"` (the old blanket setting, forbidden by issue #883 AC), which
# treated every symbol imported from these modules as `Any` and hid cross-module bugs
# like the one caught in src/capture/packet_capture.py (a `PromptNetworkDeviceUtils`
# reference that no longer existed after issue #33xx extracted it out of MistHelper).
#
# Graduated in this PR (issue #883):
#   maps_manager, maps_manager.*      -- root module never existed; only src.maps.maps_manager
#   mist-ops-platform.*, ops-portal.* -- hyphenated names are not valid Python modules;
#                                         patterns never matched anything
#   scripts.*, specs.*                -- dev tooling and planning artifacts; not imported
#                                         by src/, so no follow_imports effect
#   MistHelper.*                      -- MistHelper.py is a single module, no submodules
#
# Follow-ups: as MistHelper monolith classes graduate, the `MistHelper` entry shrinks;
# src.maps.* and web_portal.* need their own dedicated typing sweeps (out of scope here).
module = ["MistHelper", "src.maps.*", "web_portal.*"]
follow_imports = "silent"

[[tool.mypy.overrides]]
# src.db: polyglot database modules use python-arango and redis SDKs which have
# untyped methods and return union types. Relax strict checks here; tighten in Phase 2.
module = ["src.db", "src.db.*"]
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
# Wave 2 extracted modules: legacy code extracted as-is from MistHelper.py monolith.
# Uses module-level dependency injection (Any-typed globals) and mixin patterns that
# produce attr-defined errors. Relax strict checks per module with narrower per-flag
# opt-outs (no blanket ignore_errors); graduate individual modules off the override
# once type annotations are added and mypy passes at strict mode.
#
# Graduated (removed from list) — pass strict mypy as of issue #882:
#   src.cache.*                    (0 errs pre-graduation)
#   src.ssh.ssh_runner             (0 errs pre-graduation)
#   src.ssh.cli_shell_manager      (1 err  fixed pre-graduation: no-any-return cast)
#   src.ssh.ssh_runner_manager     (2 errs fixed pre-graduation: no-any-return cast + ignore code)
#
# Remaining (still overridden) — error counts at strict mypy captured 2026-07-19,
# tracked for follow-up under issue #882 comments (module list to graduate next):
#   src.analytics.*     ( 15 errs)  src.api.*           ( 23 errs)
#   src.device.*        ( 36 errs)  src.export.*        (189 errs)
#   src.gateway.*       ( 92 errs)  src.input.*         ( 14 errs)
#   src.inventory.*     ( 94 errs)  src.org.*           ( 55 errs)
#   src.reports.*       (  7 errs)  src.site.*          ( 17 errs)
#   src.troubleshooting.* ( 7 errs) src.ui.*            ( 12 errs)
#   src.websocket.*     ( 79 errs)
module = [
    "src.analytics.*",
    "src.api.*",
    "src.export.*",
    "src.gateway.*",
    "src.input.*",
    "src.inventory.*",
    "src.org.*",
    "src.device.*",
    "src.reports.*",
    "src.site.*",
    "src.troubleshooting.*",
    "src.ui.*",
    "src.websocket.*",
]
# WHY (per-flag opt-outs): each flag below is relaxed for a specific documented
# reason -- collectively they replace the blanket `ignore_errors = true`, so mypy
# still runs and catches regressions in these subtrees; only the specific patterns
# below are permitted.
disallow_untyped_defs = false      # Wave-2 legacy functions lack annotations; add over time.
disallow_incomplete_defs = false   # Same reason as disallow_untyped_defs.
disallow_untyped_calls = false     # Many callees are still Any-typed (deps.* mixins).
disallow_any_generics = false      # Legacy uses bare list/dict; graduate as we add generics.
warn_return_any = false            # Any-typed helper chains propagate; tighten with casts later.
check_untyped_defs = false         # Untyped legacy defs would otherwise flood errors.
warn_unused_ignores = false        # Existing type: ignore comments predate current mypy version.
# WHY (per-code disables): each code below is disabled for a specific documented
# Wave-2 pattern -- collectively narrower than `ignore_errors = true` (which the
# AC forbids), so mypy still catches every OTHER category of error in these
# subtrees. Graduate individual modules off the override as annotations land.
# Error counts captured 2026-07-19 across the 13 modules in `module` above.
disable_error_code = [
    "attr-defined",   # 60 errs: Wave-2 mixin pattern (e.g. ServicePingDiscoveryMixin
                      # references self.site_id / self._debug_print supplied by the
                      # host class that mixes it in). Real fix = ABC + Protocol.
    "arg-type",       # 5 errs: Any-typed helper results flow into typed callees.
    "index",          # 5 errs: legacy code indexes Any-typed dicts (e.g. deps.state[...]).
    "return-value",   # 4 errs: Wave-2 helpers return Any where callers annotate a type.
    "call-overload",  # 3 errs: int()/str() called on Any-typed values from deps.*.
    "assignment",     # 2 errs: Any values assigned into typed slots.
    "union-attr",     # 1 err : Any-typed vars treated as unions in legacy branches.
    "var-annotated",  # 1 err : bare `foo = {}` needs annotation; add during graduation.
    "misc",           # 4 errs: mypy "miscellaneous" bucket (mixin base-class subclass
                      # detection, method-assign in test fixtures, etc.).
]

[tool.bandit]
targets = ["MistHelper.py", "maps_manager.py", "wsgi.py", "web_portal", "mist-ops-platform", "ops-portal", "src"]
# tools/test_quality_analyzer/fixtures: deliberately-bad code used as test
# material by the analyzer — mirrors the ruff per-file-ignore for the same tree
# (see [tool.ruff.lint.per-file-ignores] at "tools/test_quality_analyzer/fixtures/bad/**").
# WHY both separator forms: bandit compares each entry against the scanned path
# with a plain substring test and never normalizes the separator. The forward
# slash matches a Linux path only, so a Windows run reported 42 phantom
# findings from this tree (issue #1722). Keep both spellings.
# The bandit job in .github/workflows/ci.yml checks this rule. The step "Check
# the bandit exclude list on both path separators" fails when an entry that
# holds a separator carries one spelling only.
exclude_dirs = [
    "tests",
    ".venv",
    "node_modules",
    "scripts",
    "specs",
    "tools/test_quality_analyzer/fixtures",
    "tools\\test_quality_analyzer\\fixtures",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: tests that call the real Mist API (require .env credentials)",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "setup.py",
    "*/site-packages/*",
    "src/maps/*",
]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# --- Black (redundant with ruff format, included for explicit gate) ---
[tool.black]
line-length = 120
target-version = ["py313"]

# --- Pylint ---
[tool.pylint.main]
fail-under = 9.5

# src/maps, src/ssh, and src/ui stay out of the pylint run.
#
# The exclusion used to sit on the CI command line as --ignore=maps,ssh,ui, where a
# reader of this file could not see it. Issue #891 moved it here, so one file holds
# the whole gate configuration. Issue #889 set the same rule for bandit.
#
# Reason: the three packages report 529 messages. The largest groups are 123
# import-outside-toplevel, 93 invalid-name, 71 protected-access, and 61
# use-dict-literal. Without the exclusion the Linux score falls from 9.53 to 9.41,
# which fails the 9.5 gate. Pull request #1723 tried the removal and reverted it.
#
# Removal plan: issue #891 tracks the fixes. Delete an entry below when its package
# holds the score above 9.5 on Linux. A Windows run is not a valid check, because it
# reports 9.71 where Linux reports 9.41 for the same commit.
ignore-paths = [
  '^src[\\/]maps[\\/].*$',
  '^src[\\/]ssh[\\/].*$',
  '^src[\\/]ui[\\/].*$',
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
# Docstring enforcement handled by pydocstyle/interrogate.
#
# W1203 (logging-fstring-interpolation) was dropped from the disable list in
# #887 (this commit) after `pylint --enable=W1203 --disable=all src/` reported
# 0 violations -- the project's #429 logger sweep converted every `logger.info(f"...")`
# site to `logger.info("... %s", val)` form, so the historical justification
# ("project uses f-strings throughout for readability") is now obsolete.
#
# W0613 (unused-argument) and W0718 (broad-exception-caught) remain disabled
# repo-wide; narrowing them is tracked as separate #887 follow-up slices --
# W0613 has 20 sites (mostly WebSocket protocol-mandated callback signatures
# in `src/websocket/manager.py` plus a scattering across capture/firmware/ssh
# handlers), and W0718 has 493 sites where broad `except Exception:` blocks
# are intentional in cleanup/error handlers. Each needs a per-site audit.
disable = ["C0114", "C0115", "C0116", "W0613", "W0718"]

[tool.pylint.basic]
good-names = ["db", "ok"]

# --- pydocstyle ---
[tool.pydocstyle]
convention = "google"
match-dir = "(?!tests|\\.).*"

# --- Interrogate (docstring coverage) ---
[tool.interrogate]
fail-under = 90
exclude = ["tests", ".venv", "setup.py"]
verbose = 1
generate-badge = "."
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = false
ignore-private = false

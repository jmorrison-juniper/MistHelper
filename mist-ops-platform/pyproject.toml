[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "mist-ops-platform"
version = "0.1.0"
description = "Operator-grade configuration management platform for Juniper Mist"
readme = "docs/architecture.md"
requires-python = ">=3.15"  # Align the platform minimum with the requested Python baseline.
license = { text = "MIT" }
authors = [{ name = "jmorrison-juniper" }]

dependencies = [
    "fastapi>=0.165",
    "uvicorn[standard]>=0.54",
    "celery[redis]>=5.7",
    "sqlalchemy[asyncio]>=2.1.9",  # Issue #3346: SQLAlchemy 2.1 does not install greenlet, and the async engine needs it.
    "alembic>=1.20.1",
    "asyncpg>=0.32",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "httpx>=0.28.1",
    "redis>=8.1",
    "tenacity>=9.2.1",
    "structlog>=26.1",
    "deepdiff>=8.6.2,<9.0",  # DeepDiff 9 builds cachebox with PyO3, which does not support Python 3.15 yet.
    "prometheus-client>=0.26",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "apscheduler>=3.11.3",
    "hvac>=2.4",
    "mistapi>=0.64.1",
    "cryptography>=50.0.2",
    "authlib>=1.9.10",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "testcontainers==4.15.0",
    "fakeredis[lua]==2.40.0",
    "ruff==0.17.6",
    "mypy==2.4.1",
]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter) — T003
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py315"  # Match lint rules to the supported Python floor.
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "PLR",  # pylint refactor
]
ignore = [
    "PLR0913",  # too-many-arguments — we enforce <=5 via review, not lint
]

[tool.ruff.lint.pylint]
max-args = 5
max-statements = 15  # ~25 lines when expanded (accounts for blank lines)

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy (type checker) — T003
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.15"  # Match type analysis to the supported Python floor.
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "mistapi.*",
    "celery.*",
    "redis.*",
    "hvac.*",
    "deepdiff.*",
    "prometheus_client.*",
    "opentelemetry.*",
    "apscheduler.*",
    "authlib.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error", "ignore::DeprecationWarning"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: requires running containers",
    "contract: API contract validation",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]

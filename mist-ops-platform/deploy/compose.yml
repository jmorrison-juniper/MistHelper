# ---------------------------------------------------------------------------
# compose.yml — Local development stack
# PostgreSQL 16, Redis 7, MinIO, Vault (dev mode)
# ---------------------------------------------------------------------------
name: mist-ops-platform

services:
  # ---------- Data stores ----------
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mistops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-mistops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mistops}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ops-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ops-network

  minio:
    image: minio/minio:latest
    ports:
      - "9020:9000"
      - "9021:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ops-network

  vault:
    image: hashicorp/vault:1.17
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ops-network

  # ---------- Application ----------
  api:
    build:
      context: ..
      dockerfile: deploy/Containerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mistops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-mistops}
      REDIS_URL: redis://redis:6379/0
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
      MIST_WEBHOOK_SECRET: ${MIST_WEBHOOK_SECRET:-dev-webhook-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - ops-network
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Containerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mistops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-mistops}
      REDIS_URL: redis://redis:6379/0
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ops-network
    restart: unless-stopped

  beat:
    build:
      context: ..
      dockerfile: deploy/Containerfile.worker
    entrypoint: ["celery", "-A", "src.worker.celeryconfig", "beat", "--loglevel=info", "-s", "/app/data/celerybeat-schedule"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mistops}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-mistops}
      REDIS_URL: redis://redis:6379/0
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ops-network
    restart: unless-stopped

  # ---------- Frontend ----------
  ops-portal:
    build:
      context: ../../ops-portal
      dockerfile: Containerfile
    container_name: ops-portal
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - ops-network
    restart: unless-stopped

networks:
  ops-network:
    driver: bridge

volumes:
  pgdata:
  miniodata:

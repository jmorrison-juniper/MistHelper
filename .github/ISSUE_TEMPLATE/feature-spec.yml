name: Feature Spec
description: Structured feature specification for MistHelper development
title: "[Spec]: "
labels: ["feature-spec"]
body:
  - type: textarea
    id: problem-goal
    attributes:
      label: Problem / Goal
      description: What problem does this feature solve? What is the desired outcome?
      placeholder: Describe the problem or goal clearly. Include who is affected and why this matters.
    validations:
      required: true

  - type: textarea
    id: interfaces-behavior
    attributes:
      label: Interfaces & Behavior
      description: How will users interact with this feature? What inputs, outputs, and behaviors are expected?
      placeholder: |
        Describe CLI flags, menu options, API endpoints, or web UI interactions.
        Include expected input formats and output formats (CSV, SQLite, console).
    validations:
      required: true

  - type: textarea
    id: constraints-performance
    attributes:
      label: Constraints / Performance
      description: Any performance requirements, resource limits, or technical constraints?
      placeholder: |
        Examples: Must complete within 60 seconds for 1000 devices.
        Must work behind Zscaler proxy. Must not exceed 100MB memory.
    validations:
      required: false

  - type: textarea
    id: security-secrets
    attributes:
      label: Security & Secrets
      description: Does this feature handle sensitive data, credentials, or external access?
      placeholder: |
        List any API tokens, passwords, or PII involved.
        Describe how secrets should be loaded (e.g., .env, environment variables).
        Note any input validation or sanitization requirements.
    validations:
      required: true

  - type: textarea
    id: test-plan
    attributes:
      label: Test Plan
      description: |
        How should this feature be tested? Include unit, integration, and edge case tests.
        For Hypothesis property-based tests, define properties as invariants:
        - "For any valid X, function(X) returns Y"
        - "For any dict D, flatten(D) has only string keys"
      placeholder: |
        Unit tests: test_feature_happy_path, test_feature_edge_case
        Integration: test with live API (optional, behind flag)
        Properties (Hypothesis): For any valid hostname, validate_hostname returns True
    validations:
      required: true

  - type: textarea
    id: migration-compatibility
    attributes:
      label: Migration / Compatibility
      description: Does this feature affect existing data, configs, or workflows?
      placeholder: |
        Breaking changes, database migrations, config file changes,
        backward compatibility requirements.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What must be true for this feature to be considered complete?
      placeholder: |
        - [ ] Given X, when Y, then Z
        - [ ] All unit tests pass
        - [ ] Coverage >= 70%
        - [ ] No new Ruff violations
        - [ ] Documentation updated
    validations:
      required: true

  - type: textarea
    id: implementation-notes
    attributes:
      label: Implementation Notes
      description: Any technical context, prior art, or suggested approaches?
      placeholder: |
        Relevant existing code, libraries to use, patterns to follow.
        References to agents.md or copilot-instructions.md conventions.
    validations:
      required: false

  - type: textarea
    id: ui-behavior-testing
    attributes:
      label: UI Behavior & Automated Testing Expectations
      description: For features involving the web UI (Maps Manager, ops portal), describe expected browser interactions and Playwright test scenarios.
      placeholder: |
        Page load expectations, navigation flows, form interactions.
        AI browser agent should verify: page renders, buttons respond, data displays correctly.
        Playwright test scenarios: open page, click element, verify content.
    validations:
      required: false

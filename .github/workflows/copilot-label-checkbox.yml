# Copilot Label from Issue Checkbox
# When a new issue is created with the "Assign to Copilot Coding Agent" checkbox
# checked, the shared workflow in misthelper-devtools adds the 'copilot' label
# and assigns the agent in the same run.
#
# WHY this workflow assigns the agent itself: the assignment once lived in
# copilot-auto-assign.yml, which started on every labeled event. GitHub cannot
# filter a label name at the trigger, so that workflow started for every label
# on every issue and skipped on almost all of them. This workflow already runs
# once for each new issue, so it carries the work with no extra run. A label
# that GITHUB_TOKEN adds also starts no labeled workflow.
#
# The assignment needs the COPILOT_ASSIGN_TOKEN repository secret. See
# copilot-auto-assign.yml for the prerequisites. Without the secret, the shared
# workflow writes one comment on the issue that tells how to set it up.
#
# A maintainer who wants the agent on an issue that already exists starts
# copilot-auto-assign.yml by hand and names the issue number.

name: Copilot Label from Checkbox

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  check-copilot-checkbox:
    permissions:
      issues: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-copilot-assign.yml@e0bcb680817721a41d3add1dfb7498afeadb6503 # v0.3.0
    with:
      issue-number: ${{ github.event.issue.number }}
      require-checkbox: true
      add-copilot-label: true
    secrets:
      assign-token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
# ================================================================
# Auto-merge — merge a labeled pull request, then start the main gates
# ================================================================
# GitHub starts no workflow run from an event that GITHUB_TOKEN creates. The
# rule stops a recursive loop. This workflow merges with GITHUB_TOKEN, so a
# merge commit lands on main and starts no push run. Issue #1851 records the
# effect. The security tab, the container image, and the post-merge gate
# result all went stale.
#
# A workflow_dispatch call is the one exception that GitHub honors. The shared
# workflow therefore starts each main workflow with an explicit dispatch call.
#
# The shared workflows in misthelper-devtools do the work (issue #3487). The
# auto-merge job enables auto-merge, starts the main workflows after a merge,
# tells the reader when a pull request edits a workflow file (issue #1954), and
# reports a push that arrived after a merge. The close-linked-issues job closes
# the issues that a merged pull request links.
# ================================================================
name: Auto-merge

on:
  pull_request:
    # The closed type carries the merge result. The shared dispatch job reads
    # that result and repairs main in seconds.
    types: [labeled, synchronize, opened, reopened, closed]
  # WHY this push trigger stays, although it starts one run for each push to a
  # feature branch: the shared orphan job reads that push and reports a commit
  # that arrived after its pull request merged. The repository deletes a branch
  # on merge and squashes every merge, so an orphaned commit is easy to make and
  # hard to see. Issue #1960 records a real loss. One run for each push costs
  # about one minute, and the schedule below cannot replace it, because a
  # schedule reads no push event.
  push:
    branches-ignore:
      - main
  schedule:
    # The backstop. GitHub can suppress the closed event above, because
    # GITHUB_TOKEN performs the merge. This run repairs main even when no
    # merge event arrives.
    # WHY every six hours and not every hour: the hourly form started about 720
    # runs each month, and GitHub bills a whole minute for each one. That spent
    # more than a third of the monthly allowance on a backstop that finds work
    # only after a merge. Four runs a day still repair main on the same day.
    - cron: '37 */6 * * *'
  # A maintainer can start the dispatch job by hand after an outage.
  workflow_dispatch:

# Each job below states the permissions that the job needs. The empty map here
# removes every other permission from every job.
permissions: {}

jobs:
  auto-merge:
    permissions:
      # A dispatch call starts each main workflow.
      actions: write
      # The merge writes to the base branch.
      contents: write
      # The job sets the auto-merge state and writes the notice comments.
      pull-requests: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-auto-merge.yml@bf1ba8a29ee9bab27b721db6e613fd5cd83d82fa # v0.4.0
    with:
      # The workflows that a push to main starts. The dispatch job reads this
      # one list, so a new main workflow needs one edit only.
      main-workflows: 'ci.yml codeql.yml container-build.yml'
      # The orphan job reads the push trigger above (issue #1960).
      report-orphaned-push: true

  close-linked-issues:
    # Issue #1926 recorded 12 merged pull requests in a row that left their
    # linked issue open. Two paths reach this job. A closed pull request repairs
    # a human merge in seconds. The six-hour schedule repairs a merge that
    # GITHUB_TOKEN made, because GitHub starts no closed-event run from that
    # merge. close-linked-issues.yml calls the same shared workflow twice a day.
    if: >-
      github.event_name != 'push'
      && (github.event_name != 'pull_request'
      || (github.event.action == 'closed'
      && github.event.pull_request.merged == true))
    permissions:
      # The job comments on and closes an issue.
      issues: write
      # The job reads the linked issues of each merged pull request.
      pull-requests: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-close-linked-issues.yml@bf1ba8a29ee9bab27b721db6e613fd5cd83d82fa # v0.4.0
    with:
      # Four runs a day read each merged pull request four times.
      lookback-hours: '24'
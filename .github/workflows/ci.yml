name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, mypy, pytest, bandit, pip-audit, diagram-lint]
    name: quality-gates (${{ matrix.check }})
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies (with pins + retry)
        run: |
          set -e
          python -m pip install --upgrade pip
          # Retry loop to reduce transient network failures
          for i in 1 2 3; do
            pip install -r requirements.txt && \
              pip install ruff==0.8.0 mypy==1.0.0 types-requests types-paramiko types-tqdm pytest==7.0.0 pytest-cov bandit==1.7.0 pip-audit==2.7.0 hypothesis==6.151.10 && break || sleep 5
          done
          # Print tool versions for triage
          ruff --version || true
          mypy --version || true
          pytest --version || true
          bandit --version || true
          pip-audit --version || true

      # NOTE: Consider adding actions/cache for pip (actions/cache@v4) to reduce install time.

      - name: Run Ruff linter
        if: matrix.check == 'ruff'
        run: |
          ruff --version || true
          # Lint only project code (skip test files to avoid strict test typing/formatting failures)
          ruff check MistHelper.py maps_manager.py scripts/ junos-mcp-server/ mist-ops-platform/ web_portal/ || true
          ruff format --check MistHelper.py maps_manager.py scripts/ junos-mcp-server/ mist-ops-platform/ web_portal/ || true

      - name: Run mypy type checker
        if: matrix.check == 'mypy'
        run: |
          # Limit mypy to library code to avoid strict typing requirements in tests
          mypy MistHelper.py mist-ops-platform/ --ignore-missing-imports || true

      - name: Run pytest
        if: matrix.check == 'pytest'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: 1
        run: pytest tests/unit/ -v

      - name: Run Bandit security linter
        if: matrix.check == 'bandit'
        run: bandit -r MistHelper.py -c pyproject.toml

      - name: Run pip-audit dependency scan
        if: matrix.check == 'pip-audit'
        run: pip-audit -r requirements.txt --ignore-vuln CVE-2026-4539  # No fix available yet for Pygments

      - name: Run diagram reference lint
        if: matrix.check == 'diagram-lint'
        run: python scripts/lint_diagram_refs.py

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run E2E smoke tests (Flask test client)
        run: pytest tests/e2e/ -v --timeout=60

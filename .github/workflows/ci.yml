name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, mypy, pytest, bandit, pip-audit, diagram-lint]
    name: quality-gates (${{ matrix.check }})
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy types-requests types-paramiko types-tqdm pytest pytest-cov bandit pip-audit hypothesis

      - name: Run Ruff linter
        if: matrix.check == 'ruff'
        run: |
          ruff check MistHelper.py tests/
          ruff format --check MistHelper.py tests/

      - name: Run mypy type checker
        if: matrix.check == 'mypy'
        run: mypy MistHelper.py

      - name: Run pytest
        if: matrix.check == 'pytest'
        run: pytest tests/unit/ -v

      - name: Run Bandit security linter
        if: matrix.check == 'bandit'
        run: bandit -r MistHelper.py -c pyproject.toml

      - name: Run pip-audit dependency scan
        if: matrix.check == 'pip-audit'
        run: pip-audit -r requirements.txt --ignore-vuln CVE-2026-4539  # No fix available yet for Pygments

      - name: Run diagram reference lint
        if: matrix.check == 'diagram-lint'
        run: python scripts/lint_diagram_refs.py

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run E2E smoke tests (Flask test client)
        run: pytest tests/e2e/ -v --timeout=60

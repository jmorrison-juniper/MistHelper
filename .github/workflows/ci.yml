name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [ruff, mypy, pytest, bandit, pip-audit]
        include:
          - check: mypy
            soft: true
          - check: bandit
            soft: true
    name: quality-gates (${{ matrix.check }})
    continue-on-error: ${{ matrix.soft == true }}
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy types-requests types-paramiko types-tqdm pytest pytest-cov bandit pip-audit hypothesis

      - name: Run Ruff linter
        if: matrix.check == 'ruff'
        run: |
          ruff check MistHelper.py tests/
          ruff format --check MistHelper.py tests/

      - name: Run mypy type checker
        if: matrix.check == 'mypy'
        run: mypy MistHelper.py

      - name: Run pytest with coverage
        if: matrix.check == 'pytest'
        run: pytest tests/unit/ --cov --cov-fail-under=50

      - name: Run Bandit security linter
        if: matrix.check == 'bandit'
        run: bandit -r MistHelper.py -c pyproject.toml

      - name: Run pip-audit dependency scan
        if: matrix.check == 'pip-audit'
        run: pip-audit -r requirements.txt

  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout playwright

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run E2E smoke tests (Flask test client)
        run: pytest tests/e2e/ -v --timeout=60

# ================================================================
# Quality Gates — Comprehensive CI required before auto-merge
# ================================================================
# Portable: copy to any repo, customize the env block below.
# Reusable: other workflows can call via workflow_call.
# Failures: auto-creates GitHub issues for each failing gate.
# ================================================================
name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.13'
      src-path:
        type: string
        default: 'src/'
      coverage-threshold:
        type: string
        default: '90'
      pylint-threshold:
        type: string
        default: '9.5'
      interrogate-threshold:
        type: string
        default: '90'
      vulture-confidence:
        type: string
        default: '70'
      create-issues:
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

env:
  # --- Customize per repo (overridden by workflow_call inputs) ---
  PYTHON_VERSION: ${{ inputs.python-version || '3.13' }}
  SRC_PATH: ${{ inputs.src-path || 'src/' }}
  # Issue #888: SRC_PATH used to scope every gate to src/, so MistHelper.py, wsgi.py,
  # web_portal, tools, and starlink_dashboard.py went unscanned. Each gate below now
  # names the widest scope it passes today. The measurement date is 2026-08-05, and
  # every exclusion states the count that blocks it. Widen a scope when its count
  # reaches zero. SRC_PATH still drives the two gates whose scope changes their
  # threshold arithmetic, which are the coverage gate and the pylint score gate.
  #
  # mypy: clean on src/, MistHelper.py, and wsgi.py under the strict settings.
  # MistHelper.py is genuinely checked here, proved by injecting a type error and
  # watching the gate catch it. Excludes starlink_dashboard.py (76 errors),
  # web_portal (168), and tools (61). See [tool.mypy] exclude in pyproject.toml.
  MYPY_PATHS: 'src/ MistHelper.py wsgi.py'
  # radon: no block passes complexity 10 in src/, MistHelper.py, wsgi.py, or
  # starlink_dashboard.py. Excludes web_portal (2 blocks) and tools (20 blocks).
  RADON_PATHS: 'src/ MistHelper.py wsgi.py starlink_dashboard.py'
  # vulture: 0 findings at confidence 70 everywhere except tools, which reports 6.
  VULTURE_PATHS: 'src/ MistHelper.py wsgi.py starlink_dashboard.py web_portal'
  # pydocstyle: 0 violations in src/, wsgi.py, and web_portal. Excludes
  # MistHelper.py (3), starlink_dashboard.py (11), and tools (2).
  PYDOCSTYLE_PATHS: 'src/ wsgi.py web_portal'
  # interrogate: every target clears the 90 percent floor, so this gate covers the
  # whole project. Lowest measured value is web_portal at 97.5 percent.
  INTERROGATE_PATHS: 'src/ MistHelper.py wsgi.py starlink_dashboard.py web_portal tools'
  COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold || '80' }}
  PYLINT_THRESHOLD: ${{ inputs.pylint-threshold || '9.5' }}
  INTERROGATE_THRESHOLD: ${{ inputs.interrogate-threshold || '90' }}
  # Vulture reports 0 findings at 90, at 80, and at 70. The cliff sits at 60, which
  # reports 306. The floor stops at 70 for issue #892, because 70 removes the maximum
  # value without hiding a finding. A move to 60 needs its own issue and its own triage.
  VULTURE_CONFIDENCE: ${{ inputs.vulture-confidence || '70' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Execution is staged by observed runtime so quick feedback lands first.
# 2026-04-07 baseline on PR 56:
#   Fast   (~8-11s): Ruff, Radon, Vulture, Interrogate, Diagram lint, Bandit, pydocstyle
#   Medium (~24-32s): pip-audit, mypy
#   Slow   (~36-61s): E2E smoke tests, Pylint, pytest, Black

jobs:
  # ──────────────────────────────────────────────────────────────
  # LINT & FORMAT
  # ──────────────────────────────────────────────────────────────
  ruff:
    name: "Ruff (lint)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Fetch submodules if present
        run: |
          if [ -f .gitmodules ]; then
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule sync --recursive
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule update --init --recursive
          else
            echo "No .gitmodules found; skipping submodule init"
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt  # pinned (issue #1779)
      - name: Ruff lint
        run: ruff check .

  black:
    name: "Black (format check)"
    needs:
      - pip_audit
      - mypy
      - playwright
      - pylint
      - pytest
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Fetch submodules if present
        run: |
          if [ -f .gitmodules ]; then
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule sync --recursive
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule update --init --recursive
          else
            echo "No .gitmodules found; skipping submodule init"
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt  # pinned (issue #1779)
      - name: Black format check
        run: black --check --diff .

  # ──────────────────────────────────────────────────────────────
  # TYPE SAFETY
  # ──────────────────────────────────────────────────────────────
  mypy:
    name: "mypy (strict)"
    needs:
      - ruff
      - radon
      - vulture
      - interrogate
      - diagram_lint
      - bandit
      - pydocstyle
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Fetch submodules if present
        run: |
          if [ -f .gitmodules ]; then
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule sync --recursive
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule update --init --recursive
          else
            echo "No .gitmodules found; skipping submodule init"
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt  # pinned mypy and stubs (issue #1779)
      - name: Run mypy
        run: mypy ${{ env.MYPY_PATHS }} --config-file pyproject.toml

  # ──────────────────────────────────────────────────────────────
  # TESTS + COVERAGE
  # ──────────────────────────────────────────────────────────────
  pytest:
    name: "pytest (coverage gate)"
    needs:
      - pip_audit
      - mypy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Fetch submodules if present
        run: |
          if [ -f .gitmodules ]; then
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule sync --recursive
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule update --init --recursive
          else
            echo "No .gitmodules found; skipping submodule init"
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt  # pinned pytest stack (issue #1779)
      - name: Run tests with coverage
        # Issue #888: this gate keeps SRC_PATH. Widening the measured scope adds
        # uncovered lines to the denominator, so the percentage drops against the 80
        # floor without any test changing. Widen it only together with the tests that
        # cover the added code.
        run: pytest --cov=${{ env.SRC_PATH }} --cov-fail-under=${{ env.COVERAGE_THRESHOLD }}

  # ──────────────────────────────────────────────────────────────
  # SECURITY
  # ──────────────────────────────────────────────────────────────
  bandit:
    name: "Bandit (security)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Fetch submodules if present
        run: |
          if [ -f .gitmodules ]; then
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule sync --recursive
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule update --init --recursive
          else
            echo "No .gitmodules found; skipping submodule init"
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      # Pinned in requirements-dev.txt so Dependabot raises a new release as a
      # reviewable pull request rather than breaking CI on an unrelated commit (issue #1718)
      - run: pip install -r requirements-dev.txt  # pinned (issue #1779)
      - name: Run Bandit
        # -c pyproject.toml picks up [tool.bandit] targets/exclude_dirs (issue #881)
        # No severity flag: the gate fails on a finding at any severity, including LOW (issue #889)
        run: bandit -c pyproject.toml -r .

  pip_audit:
    name: "pip-audit (CVE scan)"
    needs:
      - ruff
      - radon
      - vulture
      - interrogate
      - diagram_lint
      - bandit
      - pydocstyle
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Fetch submodules if present
        run: |
          if [ -f .gitmodules ]; then
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule sync --recursive
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule update --init --recursive
          else
            echo "No .gitmodules found; skipping submodule init"
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt  # pinned (issue #1779)
      - name: Run pip-audit
        # Reviewed 2026-07-28 under issue #890. Both historical --ignore-vuln entries
        # are removed. `pip-audit -r requirements.txt` with no ignore flags reports
        # "No known vulnerabilities found" against the current dependency set, which
        # resolves cryptography 49.0.0 and PyJWT 2.13.0. Both packages are transitive.
        # cryptography arrives through paramiko.
        #   CVE-2026-4539  -- was recorded as a false positive in cryptography.
        #                     pip-audit no longer reports it.
        #   PYSEC-2025-183 -- also tracked as CVE-2025-45768. PyJWT upstream disputed it.
        #                     Closed issue #346 holds the dispute record. pip-audit no
        #                     longer reports it.
        # Before you add a new --ignore-vuln entry, record three facts in a comment:
        # the date of the review, a link to the upstream tracker, and the condition
        # that triggers the next review.
        run: pip-audit -r requirements.txt

  # ──────────────────────────────────────────────────────────────
  # CODE QUALITY
  # ──────────────────────────────────────────────────────────────
  pylint:
    name: "Pylint (score gate)"
    needs:
      - pip_audit
      - mypy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt  # pinned pylint (issue #1779)
      # The package exclusion lives in [tool.pylint.main] ignore-paths in pyproject.toml,
      # not on this line. Issue #891 moved it there so one file holds the gate config.
      # That comment carries the reason, the measurements, and the removal plan.
      # Issue #888: this gate keeps SRC_PATH. The score is 9.53 against a 9.5 floor, so
      # a margin of 0.03 cannot absorb a new package. Widen it only with a measurement.
      - name: Run Pylint
        run: pylint ${{ env.SRC_PATH }} --fail-under=${{ env.PYLINT_THRESHOLD }}

  radon:
    name: "Radon (complexity)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt  # pinned (issue #1779)
      - name: Check cyclomatic complexity
        run: |
          radon cc ${{ env.RADON_PATHS }} -a -nb
          radon cc ${{ env.RADON_PATHS }} -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          bad = []
          for path, blocks in data.items():
              for b in blocks:
                  if b['complexity'] > 10:
                      bad.append(f\"{path}:{b['lineno']} {b['name']} CC={b['complexity']}\")
          if bad:
              print('Cyclomatic complexity violations (>10):')
              for item in bad:
                  print(f'  {item}')
              sys.exit(1)
          print('All functions within complexity threshold.')
          "

  vulture:
    name: "Vulture (dead code)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt  # pinned (issue #1779)
      - name: Detect dead code
        run: vulture ${{ env.VULTURE_PATHS }} --min-confidence ${{ env.VULTURE_CONFIDENCE }}

  # ──────────────────────────────────────────────────────────────
  # DOCUMENTATION
  # ──────────────────────────────────────────────────────────────
  pydocstyle:
    name: "pydocstyle (docstring style)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt  # pinned (issue #1779)
      - name: Check docstring conventions
        run: pydocstyle ${{ env.PYDOCSTYLE_PATHS }}

  interrogate:
    name: "Interrogate (docstring coverage)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt  # pinned (issue #1779)
      - name: Check docstring coverage
        run: interrogate ${{ env.INTERROGATE_PATHS }} --fail-under ${{ env.INTERROGATE_THRESHOLD }} -v

  # ──────────────────────────────────────────────────────────────
  # PROJECT-SPECIFIC (remove or adapt when copying to other repos)
  # ──────────────────────────────────────────────────────────────
  diagram_lint:
    name: "Diagram reference lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python scripts/lint_diagram_refs.py

  menu_reference_drift:
    name: "Menu reference drift"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # The generator failed silently for months, so the committed pages froze on
      # an old numbering. This step re-runs it and fails when the output moves.
      - name: Regenerate the menu reference
        run: python scripts/generate_menu_wiki.py
      - name: Fail when the committed output is stale
        run: |
          set -euo pipefail
          if ! git diff --quiet -- documentation/menu_reference.md documentation/wiki/Menu-Reference.md; then
            echo "The committed menu reference does not match the generator output."
            echo "Run 'python scripts/generate_menu_wiki.py' and commit both files."
            git --no-pager diff --stat -- documentation/menu_reference.md documentation/wiki/Menu-Reference.md
            exit 1
          fi
          echo "The menu reference matches the generator output."

  playwright:
    name: "E2E smoke tests"
    needs:
      - pip_audit
      - mypy
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt  # pinned pytest and timeout plugin (issue #1779)
      - name: Run E2E smoke tests
        run: pytest tests/e2e/ -v --timeout=60

  # ──────────────────────────────────────────────────────────────
  # OPS PORTAL (TypeScript + React)
  # ──────────────────────────────────────────────────────────────
  ops_portal:
    name: "ops-portal (npm audit, types, lint, tests)"
    # Issue #1847: every gate above reads Python only, so no check covered the
    # TypeScript and React application in ops-portal/. pip-audit parses
    # requirements.txt, so it can never read an npm lockfile. Two HIGH advisories
    # therefore sat on main, and a dependency bump to this directory could break
    # the build while CI stayed green. This job closes both gaps.
    #
    # The job runs on every event rather than behind an ops-portal/** path filter.
    # A filtered job reports "skipped", and a skipped result is ambiguous both to
    # branch protection and to the two summary jobs below, which read
    # needs.ops_portal.result. The whole job costs well under a minute with the
    # npm cache warm, so an unconditional run buys a clear signal cheaply.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ops-portal
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ops-portal/package-lock.json
      - name: Install from the lockfile
        # npm ci fails when package.json and package-lock.json disagree, so this
        # step also proves the lockfile is in sync.
        #
        # --legacy-peer-deps is required today. eslint-plugin-jsx-a11y 6.10.0
        # declares a peer range of eslint <=9, and this project runs eslint 10.7.0,
        # so a strict resolve fails with ERESOLVE. Issue #1852 tracks the eslint
        # flat-config migration that removes the need for this flag.
        run: npm ci --legacy-peer-deps
      - name: Audit the npm dependency tree
        # This is the blocking security check and the reason issue #1847 exists.
        # It fails on a HIGH or a CRITICAL advisory. Dependabot reports a MODERATE
        # or a LOW finding as a pull request, so those do not block a merge here.
        run: npm audit --audit-level=high
      # The three steps below report but do not block yet. Each one fails today on
      # a configuration defect that is older than this job, so a blocking step
      # would stop every unrelated pull request on the first run. Issue #1852
      # tracks all three. Delete continue-on-error from a step as soon as its
      # defect is fixed, one step at a time.
      - name: Type check
        # Fails on "Option 'baseUrl' is deprecated". tsconfig.json needs
        # "ignoreDeprecations": "6.0", or it needs the baseUrl removal (#1852).
        continue-on-error: true
        run: npm run typecheck
      - name: Lint
        # Fails because .eslintrc.cjs uses the old format, and eslint 10 reads
        # eslint.config.js only (#1852).
        continue-on-error: true
        run: npm run lint
      - name: Unit tests
        # Fails because the project ships no vitest file yet, and vitest exits
        # non-zero when it finds no test (#1852).
        continue-on-error: true
        run: npm run test

  # ──────────────────────────────────────────────────────────────
  # FAILURE → GITHUB ISSUES (auto-create issues for each failure)
  # ──────────────────────────────────────────────────────────────
  create_failure_issues:
    name: "Create issues for failures"
    needs:
      - ruff
      - black
      - mypy
      - pytest
      - bandit
      - pip_audit
      - pylint
      - radon
      - vulture
      - pydocstyle
      - interrogate
      - ops_portal
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Ensure issue labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "bug" --color "d73a4a" --description "Something isn't working" 2>/dev/null || true
          gh label create "ci" --color "0e8a16" --description "CI/CD pipeline" 2>/dev/null || true
          gh label create "quality-gate" --color "fbca04" --description "Quality gate failure" 2>/dev/null || true
      - name: Create issues for each failed gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          declare -A RESULTS
          RESULTS[ruff]="${{ needs.ruff.result }}"
          RESULTS[black]="${{ needs.black.result }}"
          RESULTS[mypy]="${{ needs.mypy.result }}"
          RESULTS[pytest]="${{ needs.pytest.result }}"
          RESULTS[bandit]="${{ needs.bandit.result }}"
          RESULTS[pip_audit]="${{ needs.pip_audit.result }}"
          RESULTS[pylint]="${{ needs.pylint.result }}"
          RESULTS[radon]="${{ needs.radon.result }}"
          RESULTS[vulture]="${{ needs.vulture.result }}"
          RESULTS[pydocstyle]="${{ needs.pydocstyle.result }}"
          RESULTS[interrogate]="${{ needs.interrogate.result }}"
          RESULTS[ops_portal]="${{ needs.ops_portal.result }}"

          # Scope: PR failures get scoped title (per-PR), push failures use gate-only title (dedup across pushes).
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            SCOPE="PR #${PR_NUMBER}"
            SEARCH_PREFIX="CI: quality-gate"
            TITLE_SUFFIX=" (PR #${PR_NUMBER})"
            PR_LINK="**PR**: #${PR_NUMBER} — ${PR_TITLE}"
          else
            SCOPE="push to ${HEAD_REF}"
            TITLE_SUFFIX=""
            PR_LINK="**Push**: \`${HEAD_REF}\`"
          fi

          for gate in "${!RESULTS[@]}"; do
            result="${RESULTS[$gate]}"
            if [ "$result" = "failure" ]; then
              TITLE="CI: quality-gate \`${gate}\` failed${TITLE_SUFFIX}"

              # Skip if an open issue already exists with this exact scoped title.
              EXISTING=$(gh issue list --state open --search "in:title \"${TITLE}\"" --json number --jq 'length')
              if [ "$EXISTING" != "0" ]; then
                echo "Issue already exists for gate: ${gate} (scope: ${SCOPE}) — skipping"
                continue
              fi

              BODY="## Quality Gate Failure

          **Gate**: \`${gate}\`
          ${PR_LINK}
          **Branch**: \`${HEAD_REF}\`
          **Commit**: \`${{ github.sha }}\`
          **Workflow run**: ${RUN_URL}

          ### Action Required
          Review the [workflow run](${RUN_URL}) for details and fix the failing gate.

          _Auto-generated by Quality Gates CI_"

              gh issue create \
                --title "$TITLE" \
                --label "bug,ci,quality-gate" \
                --body "$BODY"
              echo "Created issue for failed gate: ${gate} (scope: ${SCOPE})"
            fi
          done

  # ──────────────────────────────────────────────────────────────
  # SUCCESS → AUTO-CLOSE resolved quality-gate issues
  # ──────────────────────────────────────────────────────────────
  close_resolved_issues:
    name: "Close resolved quality-gate issues"
    needs:
      - ruff
      - black
      - mypy
      - pytest
      - bandit
      - pip_audit
      - pylint
      - radon
      - vulture
      - pydocstyle
      - interrogate
      - ops_portal
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - name: Close issues for passing gates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          declare -A RESULTS
          RESULTS[ruff]="${{ needs.ruff.result }}"
          RESULTS[black]="${{ needs.black.result }}"
          RESULTS[mypy]="${{ needs.mypy.result }}"
          RESULTS[pytest]="${{ needs.pytest.result }}"
          RESULTS[bandit]="${{ needs.bandit.result }}"
          RESULTS[pip_audit]="${{ needs.pip_audit.result }}"
          RESULTS[pylint]="${{ needs.pylint.result }}"
          RESULTS[radon]="${{ needs.radon.result }}"
          RESULTS[vulture]="${{ needs.vulture.result }}"
          RESULTS[pydocstyle]="${{ needs.pydocstyle.result }}"
          RESULTS[interrogate]="${{ needs.interrogate.result }}"
          RESULTS[ops_portal]="${{ needs.ops_portal.result }}"

          for gate in "${!RESULTS[@]}"; do
            result="${RESULTS[$gate]}"
            if [ "$result" = "success" ]; then
              # On PR events: close only the PR-scoped issue for this gate.
              # On main push: close all open issues for this gate (main is authoritative).
              if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
                EXACT_TITLE="CI: quality-gate \`${gate}\` failed (PR #${PR_NUMBER})"
                SEARCH_QUERY="in:title \"${EXACT_TITLE}\""
              elif [ "$IS_MAIN_PUSH" = "true" ]; then
                SEARCH_QUERY="in:title \"CI: quality-gate \`${gate}\` failed\""
              else
                continue
              fi

              ISSUES=$(gh issue list --state open --label "quality-gate" --search "$SEARCH_QUERY" --json number --jq '.[].number')
              for issue_number in $ISSUES; do
                gh issue close "$issue_number" \
                  --reason completed \
                  --comment "Auto-closed: \`${gate}\` gate now passing on \`${HEAD_REF}\` (commit \`${{ github.sha }}\`)."
                echo "Closed issue #${issue_number} (gate: ${gate})"
              done
            fi
          done

name: STE Writing Lint

# Grade documentation prose against the Simplified Technical English rules. The
# job fails when a graded file scores below the threshold. Widen the file list to
# cover more documents as they reach the standard.
#
# The shared workflow in misthelper-devtools installs the linter at the pinned
# commit and grades each file (issue #3487). A change to requirements-dev.txt
# therefore does not change this job.

on:
  pull_request:
    paths:
      - "documentation/**/*.md"
      - ".ste-linter.toml"
      - ".github/workflows/ste-lint.yml"
  workflow_dispatch:

# WHY this group: a second push to the same pull request must cancel the first
# grading run. This workflow reports no required check, so a cancelled run
# blocks no merge.
concurrency:
  group: ste-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The job below states the permissions that it needs. The empty map here
# removes every other permission.
permissions: {}

jobs:
  ste-lint:
    permissions:
      # The job reads the files that it grades.
      contents: read
    # The agent skills moved out of the repository to the user level at
    # ~/.copilot/skills, so this job grades no skill file. Grade a moved skill
    # on the workstation with the command in its verification reference.
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-ste-lint.yml@0b969be7f60599f9a19ebc3069161f9353a1d830 # v0.5.2
    with:
      files: documentation/ASD-STE100_writing-guide.md
      config: .ste-linter.toml
      min-score: 80
name: STE Writing Lint

# Grade documentation prose against the Simplified Technical English rules. The
# job fails when a graded file scores below the threshold. Widen the file list to
# cover more documents as they reach the standard.

on:
  pull_request:
    paths:
      - "documentation/**/*.md"
      - ".ste-linter.toml"
      - "requirements-dev.txt"
      - ".github/workflows/ste-lint.yml"
  workflow_dispatch:

# WHY this group: a second push to the same pull request must cancel the first
# grading run. This workflow reports no required check, so a cancelled run
# blocks no merge.
concurrency:
  group: ste-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ste-lint:
    name: STE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the development tools
        run: python -m pip install -r requirements-dev.txt

      # The agent skills moved out of the repository to the user level at
      # ~/.copilot/skills, so this job grades no skill file. Grade a moved skill
      # on the workstation with the command in its verification reference.
      - name: Grade documentation with the STE linter
        run: >
          ste-linter --config .ste-linter.toml --min-score 80
          documentation/ASD-STE100_writing-guide.md

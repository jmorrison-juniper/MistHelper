name: STE Writing Lint

# Grade documentation prose against the Simplified Technical English rules. The
# job fails when a graded file scores below the threshold. Widen the file list to
# cover more documents as they reach the standard.

on:
  pull_request:
    paths:
      - "documentation/**/*.md"
      - ".github/skills/**/*.md"
      - "tools/ste_linter/**"
      - ".github/workflows/ste-lint.yml"
  workflow_dispatch:

# WHY this group: a second push to the same pull request must cancel the first
# grading run. This workflow reports no required check, so a cancelled run
# blocks no merge.
concurrency:
  group: ste-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ste-lint:
    name: STE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The Markdown files of the hardening skill are graded here. The index
      # CSV file is not graded, because the linter returns exit code 2 for a
      # file that is not Markdown and not Python.
      - name: Grade documentation with the STE linter
        run: >
          python -m tools.ste_linter --min-score 80
          documentation/ASD-STE100_writing-guide.md
          tools/ste_linter/README.md
          .github/skills/hardening-junos/SKILL.md
          .github/skills/hardening-junos/references/baseline-controls.md
          .github/skills/hardening-junos/references/stig-rules.md
          .github/skills/hardening-junos/references/corpus-operations.md
          .github/skills/hardening-junos/references/verification.md

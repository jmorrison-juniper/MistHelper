name: Build and Push Container

on:
  push:
    branches: [main]
    paths:
      - 'MistHelper.py'
      - 'requirements.txt'
      - 'Containerfile'
      - 'Dockerfile'
      - '__init__.py'
      - 'src/**'
      - 'web_portal/**'
      - 'tests/**'
  # GitHub starts no push run for a merge that GITHUB_TOKEN performs, so the
  # image on the registry went stale. Issue #1851 records the effect. The
  # Auto-merge workflow calls this trigger after every merge into main.
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version override (leave empty for auto YY.MM.DD.HH.MM)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # First job: Validate Python syntax before building
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Fetch submodules if present
        run: |
          if [ -f .gitmodules ]; then
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule sync --recursive
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule update --init --recursive
          else
            echo "No .gitmodules found; skipping submodule init"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate Python syntax
        run: |
          echo "Checking Python syntax..."
          python -m py_compile MistHelper.py
          echo "✅ Syntax check passed"

      - name: Run basic import test
        run: |
          echo "Testing basic imports..."
          python -c "import ast; ast.parse(open('MistHelper.py').read())"
          echo "✅ AST parse passed"

  # Second job: Run unit tests (only if validation passes)
  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Fetch submodules if present
        run: |
          if [ -f .gitmodules ]; then
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule sync --recursive
            git -c http.extraheader="AUTHORIZATION: bearer ${{ secrets.GITHUB_TOKEN }}" submodule update --init --recursive
          else
            echo "No .gitmodules found; skipping submodule init"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # The unit tests import the external devtools package, which requirements-dev.txt pins.
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v

  # Third job: Build and push container (only if tests pass). The shared
  # workflow in misthelper-devtools sets up QEMU and Buildx, logs in to GHCR,
  # and builds linux/amd64 and linux/arm64. It tags the image with the version
  # and with latest, and it writes the pull command to the job summary. An
  # empty version_override gives a YY.MM.DD.HH.MM version in UTC. Issue #3450
  # moved this job to the shared copy.
  build-and-push:
    needs: [validate, test]
    permissions:
      contents: read
      packages: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-container-image.yml@e0bcb680817721a41d3add1dfb7498afeadb6503 # v0.3.0
    with:
      file: ./Containerfile
      version: ${{ github.event.inputs.version_override }}
      version-tag: true
      tags: type=raw,value=latest

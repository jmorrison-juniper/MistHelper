name: Build and Push Container

on:
  push:
    branches: [main]
    paths:
      - 'MistHelper.py'
      - 'requirements.txt'
      - 'Containerfile'
      - 'Dockerfile'
      - '__init__.py'
      - 'web_portal/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version override (leave empty for auto YY.MM.DD.HH.MM)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # First job: Validate Python syntax before building
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python syntax
        run: |
          echo "Checking Python syntax..."
          python -m py_compile MistHelper.py
          echo "✅ Syntax check passed"

      - name: Run basic import test
        run: |
          echo "Testing basic imports..."
          python -c "import ast; ast.parse(open('MistHelper.py').read())"
          echo "✅ AST parse passed"

  # Second job: Run unit tests (only if validation passes)
  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest hypothesis

      - name: Run unit tests
        run: |
          python -m pytest tests/unit/ -v

  # Third job: Build and push container (only if tests pass)
  build-and-push:
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate version tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            VERSION="${{ github.event.inputs.version_override }}"
          else
            VERSION=$(date -u +"%y.%m.%d.%H.%M")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        run: |
          set -e
          if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin
            echo "Logged in using GHCR_TOKEN"
          else
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin || { echo "Login failed using GITHUB_TOKEN"; exit 1; }
            echo "Logged in using GITHUB_TOKEN"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push container image (with retry)
        run: |
          set -e
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          VERSION="${{ steps.version.outputs.version }}"
          echo "Building and pushing ${IMAGE}:${VERSION}"
          for i in 1 2 3; do
            docker buildx build --platform linux/amd64,linux/arm64 -f Containerfile -t "${IMAGE}:${VERSION}" --push --cache-from type=gha --cache-to type=gha,mode=max . && break || (
              echo "Build attempt ${i} failed; retrying..."; sleep $((i*5))
            )
          done

      - name: Summary
        run: |
          echo "## Container Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Images:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull command:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "podman pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

# Copilot Coding Agent -- Auto-Assign on Label
# When an issue receives the 'copilot' label, this workflow automatically assigns
# the Copilot Coding Agent to implement it. The agent reads .github/copilot-instructions.md
# for project conventions, creates a branch, implements the solution, and opens a PR.
#
# Prerequisites:
#   - Copilot Business/Enterprise seat on the repository owner account
#   - Copilot Coding Agent policy enabled in org/account settings
#   - 'copilot' label exists in the repository
#
# If the Copilot seat is not yet configured, the workflow posts a comment instead
# of failing silently.

name: Copilot Auto-Assign

on:
  # WHY this workflow no longer starts on a labeled event: the label event fires
  # for every label on every issue, and GitHub cannot filter a label name at the
  # trigger. The job then skipped on almost every run. A recent sample held 86
  # runs of this workflow in the last 100 runs of the repository, and all 86
  # skipped. That hid every real failure in the Actions tab.
  #
  # The checkbox workflow now assigns the agent when an issue opens, which is
  # the path almost every issue takes. A maintainer who wants the agent on an
  # issue that already exists starts this workflow by hand and names the issue.
  workflow_dispatch:
    inputs:
      issue_number:
        description: The number of the issue that the agent must take
        required: true
        type: string

permissions:
  issues: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  assign-copilot:
    runs-on: ubuntu-latest
    steps:
      - name: Assign Copilot to issue
        uses: actions/github-script@v9
        with:
          script: |
            const issueNumber = Number(context.payload.inputs.issue_number);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: issueNumber,
                assignees: ['copilot']
              });
              console.log(`Assigned Copilot to issue #${issueNumber}`);

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: ['in-progress']
              });
            } catch (error) {
              console.log(`Could not assign Copilot: ${error.message}`);

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: [
                  '**Copilot Coding Agent could not be assigned.**',
                  '',
                  'This usually means one of:',
                  '- The repository owner account does not have a Copilot Business/Enterprise seat',
                  '- The Copilot Coding Agent policy is not enabled in org/account settings',
                  '',
                  'To implement manually: open VS Code and ask Copilot Chat to work this issue.',
                  '',
                  `Error: \`${error.message}\``
                ].join('\n')
              });
            }

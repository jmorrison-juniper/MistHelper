name: Native Windows timeout budget

on:
  push:
    branches-ignore:
      - main
    paths:
      - .github/workflows/windows-timeout-budget.yml
      - tests/guardrails/e2e_timeout_budget/test_windows_timeout_budget_workflow.py
      - tests/guardrails/e2e_timeout_budget/test_timeout_budget.py
      - tests/e2e/conftest.py
      - pyproject.toml
      - requirements.txt
      - requirements-dev.txt

concurrency:
  group: windows-timeout-budget-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  windows_timeout_budget:
    name: Native Windows timeout budget
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Confirm native Windows Python
        shell: pwsh
        run: |
          if ($env:OS -ne 'Windows_NT') {
            throw 'The timeout budget acceptance requires a native Windows runner.'
          }
          python -c 'import os, sys; sys.exit(0 if os.name == "nt" and sys.version_info[:2] == (3, 15) else "Python 3.15 is not running on native Windows.")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run native timeout budget guard
        shell: pwsh
        run: |
          $junitPath = Join-Path $env:RUNNER_TEMP 'timeout-budget.xml'
          python -m pytest -q "--junitxml=$junitPath" tests/guardrails/e2e_timeout_budget/test_timeout_budget.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c 'import sys; from xml.etree import ElementTree as ET; root=ET.parse(sys.argv[1]).getroot(); suites=[root] if root.tag=="testsuite" else root.findall("testsuite"); total=sum(int(suite.get("tests","0")) for suite in suites); skipped=sum(int(suite.get("skipped","0")) for suite in suites); failures=sum(int(suite.get("failures","0")) for suite in suites); errors=sum(int(suite.get("errors","0")) for suite in suites); print(f"Native Windows tests: {total} collected, {skipped} skipped, {failures} failures, {errors} errors"); sys.exit(0 if total == 7 and skipped == 0 and failures == 0 and errors == 0 else 1)' $junitPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

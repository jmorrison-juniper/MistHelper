name: CodeQL Analysis

on:
  # No branch filter here. A pull request against any base runs the scan. A
  # filter that named main alone let a stacked pull request merge without a
  # scan, because the required check never started and never reported. Issue
  # #1952 records that gap for the Quality Gates workflow, and the same trap
  # applied here.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  # GitHub starts no push run for a merge that GITHUB_TOKEN performs, so the
  # scan on main went stale. Issue #1851 records the effect. An explicit
  # dispatch is the exception that GitHub honors, and the Auto-merge workflow
  # calls this trigger after every merge into main.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

name: CodeQL Analysis

on:
  # No branch filter here. A pull request against any base runs the scan. A
  # filter that named main alone let a stacked pull request merge without a
  # scan, because the required check never started and never reported. Issue
  # #1952 records that gap for the Quality Gates workflow, and the same trap
  # applied here.
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  # GitHub starts no push run for a merge that GITHUB_TOKEN performs, so the
  # scan on main went stale. Issue #1851 records the effect. An explicit
  # dispatch is the exception that GitHub honors, and the Auto-merge workflow
  # calls this trigger after every merge into main.
  workflow_dispatch:

# Each job names its own scopes.
permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The shared workflow runs the analysis in its job named analyze. Code
  # scanning keys the alerts on this file path and that job ID, so the alerts
  # keep the key .github/workflows/codeql.yml:analyze and the category
  # /language:python. Do not rename this file.
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-codeql.yml@3f498b1f04da258f046894a3ea6718ea6968d583 # v0.5.1
    with:
      languages: '["python"]'
      config-file: ./.github/codeql/codeql-config.yml

name: Release Artifacts

on:
  push:
    tags: ['v*.*.*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  build-standalone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create standalone bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE_DIR="misthelper-${VERSION}"
          mkdir -p "${BUNDLE_DIR}"
          cp MistHelper.py "${BUNDLE_DIR}/"
          cp requirements.txt "${BUNDLE_DIR}/"
          cp pyproject.toml "${BUNDLE_DIR}/"
          cp README.md "${BUNDLE_DIR}/"
          cp LICENSE "${BUNDLE_DIR}/"
          cp wsgi.py "${BUNDLE_DIR}/"
          cp __init__.py "${BUNDLE_DIR}/"
          cp -r src/ "${BUNDLE_DIR}/src/"
          cp -r web_portal/ "${BUNDLE_DIR}/web_portal/"
          zip -r "misthelper-${VERSION}.zip" "${BUNDLE_DIR}/"

      - name: Upload standalone bundle
        uses: actions/upload-artifact@v7
        with:
          name: standalone-bundle
          path: misthelper-*.zip

  version:
    name: Read the version from the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Remove the v from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # The shared workflow in misthelper-devtools builds linux/amd64 and
  # linux/arm64, the same platforms as container-build.yml. The old local job
  # built linux/amd64 only and then moved the latest tag to that image, so a
  # release left no arm64 image under latest. Issue #3450 records the defect.
  build-container:
    needs: [version]
    permissions:
      contents: read
      packages: write
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-container-image.yml@b140350ebc40e61b57a3a65731c0df520f143661 # v0.6.0
    with:
      file: ./Containerfile
      version: ${{ needs.version.outputs.version }}
      version-tag: true
      tags: type=raw,value=latest

  publish:
    needs: [build-python, build-standalone, build-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout must precede downloads because cleanup can remove downloaded artifacts.
      - name: Checkout tagged repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python for release notes
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Download Python artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - name: Download standalone bundle
        uses: actions/download-artifact@v8
        with:
          name: standalone-bundle

      - name: Generate release notes
        id: generate_release_notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s\n' 'phase=generate_release_notes event=before completed_requests=0 captured_files=0'
          if gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" --raw-field "tag_name=${RELEASE_TAG}" > "${RUNNER_TEMP}/generated-release-notes.json"; then
            printf '%s\n' 'phase=generate_release_notes event=after completed_requests=1 captured_files=1'
          else
            printf '%s\n' 'phase=generate_release_notes event=failed completed_requests=0 captured_files=0' >&2
            exit 2
          fi

      - name: Prepare complete release body
        id: prepare_release_body
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python -m scripts.release_body --source "${RUNNER_TEMP}/generated-release-notes.json" --output "${RUNNER_TEMP}/release-body.md" --tag "${RELEASE_TAG}" --repository "${GITHUB_REPOSITORY}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-body.md
          generate_release_notes: false
          files: |
            dist/*.whl
            dist/*.tar.gz
            misthelper-*.zip

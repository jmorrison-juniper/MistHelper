name: Release Artifacts

on:
  push:
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  build-standalone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create standalone bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE_DIR="misthelper-${VERSION}"
          mkdir -p "${BUNDLE_DIR}"
          cp MistHelper.py "${BUNDLE_DIR}/"
          cp requirements.txt "${BUNDLE_DIR}/"
          cp pyproject.toml "${BUNDLE_DIR}/"
          cp README.md "${BUNDLE_DIR}/"
          cp LICENSE "${BUNDLE_DIR}/"
          cp maps_manager.py "${BUNDLE_DIR}/"
          cp wsgi.py "${BUNDLE_DIR}/"
          cp __init__.py "${BUNDLE_DIR}/"
          cp -r web_portal/ "${BUNDLE_DIR}/web_portal/"
          zip -r "misthelper-${VERSION}.zip" "${BUNDLE_DIR}/"

      - name: Upload standalone bundle
        uses: actions/upload-artifact@v7
        with:
          name: standalone-bundle
          path: misthelper-*.zip

  build-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Lowercase image name
        id: lower
        run: echo "image_name=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.image_name }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [build-python, build-standalone, build-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - name: Download standalone bundle
        uses: actions/download-artifact@v8
        with:
          name: standalone-bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            misthelper-*.zip

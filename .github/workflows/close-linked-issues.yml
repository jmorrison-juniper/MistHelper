name: Close linked issues on merge

# GitHub does not start a workflow from an event that the GITHUB_TOKEN created,
# and auto-merge.yml enables auto-merge with that token. The pull_request trigger
# below therefore never fires for an auto-merged pull request. Measured on
# 2026-08-04: pull requests #1745, #1746, and #1748 all merged by the auto-merge
# label and started nothing at all. The schedule below sweeps for those.
# See issue #1742.
#
# The shared workflow in misthelper-devtools does the work. It closes each open
# issue that a closing keyword in the pull request body names. The sweep reads
# the timeline of each issue first, and it keeps an issue open when a person
# reopened it after the merge. The close-linked-issues job in auto-merge.yml
# follows the same rule. Issue #3450 moved this workflow to the shared copy.

on:
  pull_request:
    types: [closed]
  schedule:
    # Catches an auto-merge, which starts no pull_request event.
    # WHY twice a day and not every two hours: the two-hour form started about
    # 360 runs each month, and GitHub bills a whole minute for each one. A
    # linked issue that closes twelve hours later still closes on the same day.
    - cron: '43 */12 * * *'
  workflow_dispatch:
    inputs:
      lookback-hours:
        description: 'How many hours of merged pull requests to sweep'
        required: false
        default: '24'

permissions: {}

concurrency:
  # One sweep at a time. Two runs would race on the same issue.
  group: close-linked-issues
  cancel-in-progress: false

jobs:
  close-linked-issues:
    # A pull request that closed with no merge closes no issue, so it starts
    # no job.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    permissions:
      issues: write
      pull-requests: read
    uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-close-linked-issues.yml@e0bcb680817721a41d3add1dfb7498afeadb6503 # v0.3.0
    with:
      lookback-hours: ${{ github.event.inputs.lookback-hours || '24' }}
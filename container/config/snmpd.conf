###############################################################################
# SNMPd Configuration for MistHelper Metrics Gateway
# 
# This configuration runs the metrics gateway as a Net-SNMP pass_persist
# responder on UDP port 1161. The gateway reads Mist Cloud on a timer and
# answers every SNMP request from memory, so a poll never waits for Mist Cloud.
#
# The pass_persist handler path assumes the container runs MistHelper as
# a Python module installed on the host. The handler command below invokes
# the SNMP responder directly from the metrics_gateway package.
###############################################################################

# Listen on UDP port 1161 on all interfaces
# Port 1161 is used because rootless containers cannot bind port 161 (privileged)
listen udp:1161

# MistHelper metrics gateway pass_persist handler
# The responder answers at the enterprise OID .1.3.6.1.4.1.8072.9999.9999
# This OID is chosen as a high-numbered experimental assignment for this deployment
pass_persist .1.3.6.1.4.1.8072.9999.9999 /usr/bin/python3 -m MistHelper --metrics-snmp

# SNMPv2c community settings
# Community string is 'misthelper' (change in production environments)
rocommunity misthelper default

# System information (optional, but provides context)
sysdescr "MistHelper metrics gateway for Mist Cloud operations"
sysservices 2

# Disable write access (this agent is read-only)
rouser authPrivUser noauth
